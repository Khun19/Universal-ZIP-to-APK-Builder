name: Android Emulator Device Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/react-native-chat-demo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-emulator-device-test.yml'
      - 'docs/ANDROID-EMULATOR-REQUIREMENTS.md'
      - '.github/workflows/community-chat-demo-builder-apk.yml'
      - 'docs/TEST-MATRIX.md'
      - 'docs/VALIDATION-WORKFLOW.md'
  workflow_dispatch:

concurrency:
  group: android-emulator-device-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-install-ui-test:
    name: Build with Builder and test on Android Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_API: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_IMAGE: 'system-images;android-35;google_apis;x86_64'
      ANDROID_EMULATOR_REVISION: '37.2.13'
      ANDROID_PLATFORM_TOOLS_REVISION: '37.0.1'
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run Android Emulator UI regression tests
        run: python3 -m unittest discover -s tests -p 'test_android_emulator_ui.py' -v

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Setup Android SDK and Emulator
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools emulator

      - name: Install Android Emulator runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxrender1 libfontconfig1 libxkbcommon0
          # Diagnose missing shared libraries before sdkmanager invokes the emulator.
          ldd "${ANDROID_HOME}/emulator/emulator" | tee "${RUNNER_TEMP}/emulator-ldd.txt"
          if grep -q "not found" "${RUNNER_TEMP}/emulator-ldd.txt"; then
            echo "Android Emulator has unresolved shared-library dependencies"
            exit 1
          fi
          # Record the host virtualization capability; the boot step selects acceleration accordingly.
          if [ -e /dev/kvm ]; then
            echo "KVM device detected"
            ls -l /dev/kvm
          else
            echo "KVM unavailable; software-emulation fallback may be slow"
          fi

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager resolves these tools to the latest stable package. Keep the
          # resolved revisions fixed and fail closed if Google's package catalog drifts.
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;26.1.10909125" \
            "emulator" \
            "${ANDROID_IMAGE}"
          mkdir -p .ci-evidence
          sdkmanager --list_installed | tee .ci-evidence/android-sdk-installed-packages.txt
          python3 - <<'PY'
          import os
          from pathlib import Path

          expected = {
              "emulator": os.environ["ANDROID_EMULATOR_REVISION"],
              "platform-tools": os.environ["ANDROID_PLATFORM_TOOLS_REVISION"],
          }
          installed = {}
          in_installed_section = False
          for line in Path(".ci-evidence/android-sdk-installed-packages.txt").read_text().splitlines():
              if line.strip() == "Installed packages:":
                  in_installed_section = True
                  continue
              if in_installed_section and line.strip().lower().startswith("available packages:"):
                  break
              if in_installed_section:
                  columns = [column.strip() for column in line.split("|")]
                  if len(columns) >= 2 and columns[0] in expected:
                      installed[columns[0]] = columns[1]

          mismatches = {
              package: {"expected": revision, "installed": installed.get(package)}
              for package, revision in expected.items()
              if installed.get(package) != revision
          }
          if mismatches:
              raise SystemExit(f"Android SDK tool revision drift: {mismatches}")

          Path(".ci-evidence/android-sdk-tool-versions.txt").write_text(
              "".join(f"{package}={installed[package]}\n" for package in sorted(expected))
          )
          PY
          # Make SDK executables available in this step as well as later steps.
          export PATH="${ANDROID_HOME}/emulator:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          {
            echo "${ANDROID_HOME}/emulator"
            echo "${ANDROID_HOME}/platform-tools"
            echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
            echo "${ANDROID_HOME}/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"
          # Fail with diagnostic evidence if sdkmanager did not place the emulator binary.
          if [ ! -x "${ANDROID_HOME}/emulator/emulator" ]; then
            echo "Expected emulator binary missing at ${ANDROID_HOME}/emulator/emulator"
            find "${ANDROID_HOME}" -maxdepth 3 -type f -name emulator -print || true
            sdkmanager --list_installed
            exit 1
          fi
          command -v emulator
          java -version
          node --version
          pnpm --version
          adb version
          emulator -version
          sdkmanager --list_installed

      - name: Install locked Builder dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate pinned React Native Android platform fixture
        shell: bash
        run: |
          set -euo pipefail
          SCAFFOLD_DIR="$RUNNER_TEMP/community-chat-native-scaffold"
          rm -rf "$SCAFFOLD_DIR"
          cd "$RUNNER_TEMP"
          npx --yes @react-native-community/cli@15.0.1 init CommunityChatDemo --version 0.76.9 --directory "$SCAFFOLD_DIR" --skip-install
          test -s "$SCAFFOLD_DIR/android/gradlew"
          test -s "$SCAFFOLD_DIR/android/app/build.gradle"
          rm -rf "$GITHUB_WORKSPACE/examples/react-native-chat-demo/android"
          cp -a "$SCAFFOLD_DIR/android" "$GITHUB_WORKSPACE/examples/react-native-chat-demo/android"
          python3 - <<'PY'
          from pathlib import Path
          import os
          gradle_file = Path(os.environ["GITHUB_WORKSPACE"]) / "examples/react-native-chat-demo/android/app/build.gradle"
          text = gradle_file.read_text()
          marker = "react {"
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one React Gradle configuration block")
          text = text.replace(marker, marker + "\n    // Embed the JS bundle so the installed APK does not require Metro.\n    debuggableVariants = []", 1)
          # A debug APK normally enables React Native DevSupport, which waits for
          # Metro even when a bundle was embedded. Make this fixture self-contained
          # for emulator acceptance by disabling debuggability on its debug variant.
          import re
          build_types = re.search(r"(?ms)^\s*buildTypes\s*\{(.*?)^\s*\}", text)
          if not build_types:
              raise SystemExit("Could not locate Android buildTypes block")
          body = build_types.group(1)
          debug_blocks = list(re.finditer(r"(?m)^(\s*)debug\s*\{", body))
          if len(debug_blocks) != 1:
              raise SystemExit(f"Expected one debug build type block, found {len(debug_blocks)}")
          debug = debug_blocks[0]
          insert_at = debug.end()
          body = body[:insert_at] + "\n" + debug.group(1) + "    debuggable false" + body[insert_at:]
          text = text[:build_types.start(1)] + body + text[build_types.end(1):]
          gradle_file.write_text(text)
          updated = gradle_file.read_text()
          if "debuggableVariants = []" not in updated or not re.search(r"(?ms)buildTypes\s*\{.*?debug\s*\{[^}]*debuggable false", updated):
              raise SystemExit("Failed to configure a self-contained, non-debuggable emulator APK")
          PY

      - name: Package fixture ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd examples/react-native-chat-demo
          test -s package.json
          test -s pnpm-lock.yaml
          test -s App.js
          test -s index.js
          zip -r "$GITHUB_WORKSPACE/community-chat-demo.zip" . \
            -x "node_modules/*" "ios/*" ".gradle/*" "build/*"
          unzip -t "$GITHUB_WORKSPACE/community-chat-demo.zip"
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'package.json'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'android/gradlew'

      - name: Build APK through the actual Builder CLI
        env:
          BUILD_TIMEOUT_MS: '3600000'
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx lib/cli.ts community-chat-demo.zip 2>&1 | tee community-chat-builder-build.log

      - name: Validate APK structure and record identity
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -qx 'assets/index.android.bundle'
          aapt dump badging "$APK" | tee emulator-apk-badging.txt
          PACKAGE_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" emulator-apk-badging.txt | head -n 1)"
          test -n "$PACKAGE_ID"
          test "$PACKAGE_ID" = 'com.communitychatdemo'
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          mkdir -p .ci-evidence
          printf '%s  %s\n' "$SHA256" "$APK" > .ci-evidence/emulator-apk.sha256

      - name: Write APK provenance
        id: provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.apk_size }}
          ANDROID_API: ${{ env.ANDROID_API }}
          ANDROID_IMAGE: ${{ env.ANDROID_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import subprocess
          from pathlib import Path
          build_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          build_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          sdk_tools = Path(".ci-evidence/android-sdk-tool-versions.txt").read_text().splitlines()
          record = {
              "schema_version": 2,
              "evidence_type": "android-emulator-test",
              "build_commit_sha": build_commit,
              "build_tree_sha": build_tree,
              "pr_head_sha": os.environ["PR_HEAD_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "workflow_event_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "application_id": os.environ["PACKAGE_ID"],
              "apk_path": os.environ["APK_PATH"],
              "apk_size_bytes": int(os.environ["APK_SIZE"]),
              "apk_sha256": os.environ["APK_SHA256"],
              "android_sdk_tool_versions": sdk_tools,
              "emulator": {"api_level": int(os.environ["ANDROID_API"]), "image": os.environ["ANDROID_IMAGE"], "abi": "x86_64"},
              "runtime_test_status": "PENDING"
          }
          Path(".ci-evidence/emulator-test-provenance.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          PY

      - name: Create Android Emulator AVD
        id: create-avd
        shell: bash
        run: |
          set -euo pipefail
          # Keep AVD creation and emulator lookup on one explicit, persistent path.
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_SDK_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          {
            echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          } >> "$GITHUB_ENV"
          echo "no" | avdmanager create avd --force --name builder-api35 --package "$ANDROID_IMAGE" --device pixel_2
          mkdir -p .ci-evidence
          emulator -list-avds | tee .ci-evidence/emulator-avds.txt
          test -s "$ANDROID_AVD_HOME/builder-api35.ini"
          grep -qx 'builder-api35' .ci-evidence/emulator-avds.txt

      - name: Boot Android Emulator
        id: boot-emulator
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners may expose /dev/kvm but deny the runner user access.
          # Grant access before probing acceleration so x86_64 boots do not silently
          # fall back to very slow software emulation.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee .ci-evidence/kvm-permissions.txt
          fi
          if emulator -accel-check > .ci-evidence/emulator-accel-check.txt 2>&1; then
            ACCEL_MODE=on
            echo "Hardware virtualization acceleration available"
          else
            ACCEL_MODE=off
            export ANDROID_I_WANT_MY_TCG=yes
            echo "Hardware acceleration unavailable; using software emulation (slower)"
          fi
          echo "acceleration_mode=$ACCEL_MODE" > .ci-evidence/emulator-runtime-config.txt
          nohup emulator -avd builder-api35 -accel "$ACCEL_MODE" -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > .ci-evidence/emulator-console.log 2>&1 &
          echo $! > .ci-evidence/emulator.pid
          # Bound the first adb connection wait so a dead emulator cannot hold the job until the 100-minute job timeout.
          if ! timeout 120s adb wait-for-device; then
            echo "adb did not report an emulator device within 120 seconds"
            cat .ci-evidence/emulator-accel-check.txt || true
            tail -n 200 .ci-evidence/emulator-console.log || true
            adb devices -l || true
            exit 1
          fi
          for attempt in $(seq 1 90); do
            booted="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then break; fi
            sleep 5
          done
          test "$booted" = "1"
          timeout 10s adb shell settings put global window_animation_scale 0
          timeout 10s adb shell settings put global transition_animation_scale 0
          timeout 10s adb shell settings put global animator_duration_scale 0
          timeout 10s adb shell getprop ro.build.version.release | tee .ci-evidence/emulator-android-release.txt
          timeout 10s adb shell getprop ro.build.version.sdk | tee .ci-evidence/emulator-api-level.txt
          timeout 10s adb shell getprop ro.product.cpu.abi | tee .ci-evidence/emulator-abi.txt
          adb devices -l | tee .ci-evidence/adb-devices.txt

      - name: Install, launch, and test UI interactions
        id: runtime-test
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Software-emulated x86_64 guests can briefly lose the package service
          # after boot. Wait for Android framework readiness, then retry installation
          # only while the emulator remains connected; preserve diagnostics on failure.
          mkdir -p .ci-evidence/install
          timeout 10s adb shell getprop sys.boot_completed | tee .ci-evidence/install/boot-completed.txt
          for attempt in $(seq 1 24); do
            if timeout 10s adb shell service check package 2>&1 | tee .ci-evidence/install/package-service.txt | grep -q "found"; then
              break
            fi
            sleep 5
          done
          install_ok=0
          for attempt in 1 2 3; do
            echo "APK install attempt $attempt/3" | tee -a .ci-evidence/adb-install.log
            if timeout 120s adb install -r "$APK_PATH" 2>&1 | tee -a .ci-evidence/adb-install.log; then
              install_ok=1
              break
            fi
            adb devices -l > ".ci-evidence/install/adb-devices-attempt-${attempt}.txt" 2>&1 || true
            timeout 10s adb shell getprop sys.boot_completed > ".ci-evidence/install/boot-attempt-${attempt}.txt" 2>&1 || true
            timeout 10s adb shell service check package > ".ci-evidence/install/package-service-attempt-${attempt}.txt" 2>&1 || true
            timeout 20s adb logcat -d -v threadtime > ".ci-evidence/install/logcat-attempt-${attempt}.txt" 2>&1 || true
            tail -n 200 .ci-evidence/emulator-console.log > ".ci-evidence/install/emulator-console-attempt-${attempt}.txt" 2>&1 || true
            if ! adb get-state 2>/dev/null | grep -qx device; then
              echo "Emulator disconnected; refusing further install retries"
              break
            fi
            sleep 10
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "APK installation failed after retries; diagnostic evidence follows"
            adb devices -l || true
            timeout 10s adb shell getprop sys.boot_completed || true
            timeout 10s adb shell service check package || true
            tail -n 200 .ci-evidence/emulator-console.log || true
            exit 1
          fi
          python3 scripts/android-emulator-ui-test.py --package "$PACKAGE_ID" --evidence-dir .ci-evidence/ui
          timeout 30s adb logcat -d -v threadtime > .ci-evidence/logcat.txt
          # The emulator's full logcat includes unrelated system-service process
          # deaths. Fail only on a crash/death attributed to this APK's package.
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          package = os.environ["PACKAGE_ID"]
          escaped = re.escape(package)
          lines = Path(".ci-evidence/logcat.txt").read_text(errors="replace").splitlines()
          failures = []

          for index, line in enumerate(lines):
              if "FATAL EXCEPTION" in line:
                  block = lines[index:min(index + 50, len(lines))]
                  if any(re.search(r"\bProcess:\s*" + escaped + r"\s*,\s*PID:\s*\d+", item) for item in block):
                      failures.append(("Java fatal exception", index, line))

              if re.search(r"Fatal signal\s+\d+", line):
                  block = lines[max(0, index - 10):min(index + 60, len(lines))]
                  same_line = re.search(r"\bpid\s+\d+\s+\(" + escaped + r"\)", line)
                  tombstone = any(re.search(r">>>\s*" + escaped + r"\s*<<<", item) for item in block)
                  if same_line or tombstone:
                      failures.append(("native fatal signal", index, line))

              if re.search(r"\bProcess\s+" + escaped + r"\s+\(pid\s+\d+\)\s+has died\b", line):
                  failures.append(("app process death", index, line))

          if failures:
              print(f"Detected app-specific runtime failure for {package}:")
              for kind, index, line in failures:
                  print(f"{kind} at logcat line {index + 1}: {line}")
              sys.exit(1)

          print(f"PASS: no app-specific fatal exception, native signal, or process death for {package}")
          PY

      - name: Finalize Emulator test evidence
        if: always()
        timeout-minutes: 2
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          CREATE_AVD_OUTCOME: ${{ steps.create-avd.outcome }}
          BOOT_EMULATOR_OUTCOME: ${{ steps.boot-emulator.outcome }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime-test.outcome }}
        run: python3 scripts/finalize-android-emulator-evidence.py --evidence-dir .ci-evidence

      - name: Upload Emulator test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/
            community-chat-builder-build.log
            community-chat-demo.zip
            emulator-apk-badging.txt
            output/*.apk
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Publish workflow result annotation
        if: always()
        uses: ./.github/actions/workflow-annotation
        with:
          job-status: ${{ job.status }}
          evidence-scope: "Builder CLI APK build, APK identity checks, and Community Chat emulator UI runtime checks."
