name: API Server Rate Limit Lockfile Refresh (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - "artifacts/api-server/package.json"
      - "scripts/ci/preserve-workspace-lock-importer.rb"
      - ".github/workflows/api-server-rate-limit-lockfile-refresh.yml"

permissions:
  contents: read

concurrency:
  group: api-server-rate-limit-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'security/api-server-rate-limit-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Preserve baseline lockfile
        run: cp pnpm-lock.yaml pnpm-lock.before.yaml

      - name: Regenerate lockfile for active workspace
        run: pnpm install --lockfile-only --config.node-linker=hoisted

      - name: Retain historical M6 importer record
        run: ruby scripts/ci/preserve-workspace-lock-importer.rb

      - name: Validate active workspace frozen install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted --ignore-scripts

      - name: Commit lockfile to this PR branch only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "build(deps): refresh API server rate-limit lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
