name: Builder Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/TEST-MATRIX.md'
      - 'docs/VALIDATION-WORKFLOW.md'
      - 'docs/MILESTONE-CI-MATRIX.md'
      - 'docs/BUILD-QUALITY-SECURITY-STANDARDS.md'
      - 'docs/CLOUD-TOOLCHAIN-CAPABILITY-REGISTRY.md'
      - 'docs/DEVELOPMENT-READINESS-AUDIT.md'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/TEST-MATRIX.md'
      - 'docs/VALIDATION-WORKFLOW.md'
      - 'docs/CLOUD-TOOLCHAIN-CAPABILITY-REGISTRY.md'
      - 'docs/DEVELOPMENT-READINESS-AUDIT.md'

concurrency:
  group: builder-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests, and workspace build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Record toolchain
        run: |
          node --version
          pnpm --version
          uname -a

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and regression tests
        run: pnpm test

      - name: Build workspace packages
        run: pnpm run build

      - name: Write quality-gate provenance
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-evidence
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path

          def command(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc:
                  return f"unavailable: {exc}"

          def sha256(path):
              p = Path(path)
              if not p.is_file():
                  return None
              h = hashlib.sha256()
              with p.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          record = {
              "schemaVersion": 1,
              "evidenceType": "common-quality-gates",
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "commit": os.getenv("GITHUB_SHA"),
              "ref": os.getenv("GITHUB_REF"),
              "event": os.getenv("GITHUB_EVENT_NAME"),
              "workflow": os.getenv("GITHUB_WORKFLOW"),
              "runId": os.getenv("GITHUB_RUN_ID"),
              "runAttempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "jobStatusAtEvidenceStep": os.getenv("JOB_STATUS"),
              "runner": {"os": platform.platform(), "python": platform.python_version()},
              "toolchain": {
                  "node": command("node", "--version"),
                  "pnpm": command("pnpm", "--version"),
                  "git": command("git", "--version"),
              },
              "inputs": {
                  "pnpmLockSha256": sha256("pnpm-lock.yaml"),
                  "packageJsonSha256": sha256("package.json"),
                  "pnpmWorkspaceSha256": sha256("pnpm-workspace.yaml"),
              },
              "source": {"gitHead": command("git", "rev-parse", "HEAD")},
          }
          Path(".ci-evidence/quality-gate-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\\n", encoding="utf-8"
          )
          PY

      - name: Upload quality-gate provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/quality-gate-provenance.json
          if-no-files-found: error
          retention-days: 30
