name: Builder Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/TEST-MATRIX.md'
      - 'docs/VALIDATION-WORKFLOW.md'
      - 'docs/CLOUD-TOOLCHAIN-CAPABILITY-REGISTRY.md'
      - 'docs/DEVELOPMENT-READINESS-AUDIT.md'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/TEST-MATRIX.md'
      - 'docs/VALIDATION-WORKFLOW.md'
      - 'docs/CLOUD-TOOLCHAIN-CAPABILITY-REGISTRY.md'
      - 'docs/DEVELOPMENT-READINESS-AUDIT.md'

concurrency:
  group: builder-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests, and workspace build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Record toolchain
        run: |
          node --version
          pnpm --version
          uname -a

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and regression tests
        env:
          RUN_HTTP_UPLOAD_INTEGRATION: "1"
        run: pnpm test

      - name: Build workspace packages
        run: pnpm run build
