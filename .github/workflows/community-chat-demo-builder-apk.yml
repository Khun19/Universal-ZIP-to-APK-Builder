name: M6 Isolated Community Chat Demo ZIP to APK

on:
  push:
    branches:
      - feat/m6-community-chat-demo-mainline
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/community-chat-demo-builder-apk.yml"
      - "examples/react-native-chat-demo/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder-zip-to-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source and workflow commit identities
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
          test "${#SOURCE_COMMIT}" -eq 40
          test "${#WORKFLOW_SHA}" -eq 40
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"
          echo "Source commit: $SOURCE_COMMIT"
          echo "Workflow checkout/merge SHA: $WORKFLOW_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.23.0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build toolchain
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          java -version
          sdkmanager --list_installed

      - name: Install Builder workspace dependencies
        run: pnpm install --config.node-linker=hoisted --frozen-lockfile --dangerously-allow-all-builds

      - name: Generate matching React Native Android platform for the demo ZIP
        run: |
          set -euo pipefail
          SCAFFOLD_DIR="$RUNNER_TEMP/community-chat-native-scaffold"
          rm -rf "$SCAFFOLD_DIR"
          cd "$RUNNER_TEMP"
          npx --yes @react-native-community/cli@15.0.1 init CommunityChatDemo --version 0.76.9 --directory "$SCAFFOLD_DIR" --skip-install
          test -s "$SCAFFOLD_DIR/android/gradlew"
          test -s "$SCAFFOLD_DIR/android/app/build.gradle"
          rm -rf "$GITHUB_WORKSPACE/examples/react-native-chat-demo/android"
          cp -a "$SCAFFOLD_DIR/android" "$GITHUB_WORKSPACE/examples/react-native-chat-demo/android"
          python3 - <<'PY'
          from pathlib import Path
          gradle_file = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "examples/react-native-chat-demo/android/app/build.gradle"
          text = gradle_file.read_text()
          marker = 'react {'
          if text.count(marker) != 1:
              raise SystemExit("Expected exactly one React Gradle configuration block")
          text = text.replace(marker, marker + '\n    // This APK must run without Metro; embed the JS bundle in every variant.\n    debuggableVariants = []', 1)
          gradle_file.write_text(text)
          if 'debuggableVariants = []' not in gradle_file.read_text():
              raise SystemExit("Failed to enable embedded React Native bundle")
          PY
          echo "Generated Android scaffold with embedded React Native JS bundle enabled"

      - name: Package clean Community Chat Demo ZIP
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/examples/react-native-chat-demo"
          test -s index.js
          zip -r "$GITHUB_WORKSPACE/community-chat-demo.zip" . \
            -x "node_modules/*" "ios/*" ".gradle/*" "build/*"
          unzip -t "$GITHUB_WORKSPACE/community-chat-demo.zip"
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'package.json'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'App.js'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'index.js'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'metro.config.js'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'android/gradlew'
          unzip -Z1 "$GITHUB_WORKSPACE/community-chat-demo.zip" | grep -qx 'android/app/build.gradle'

      - name: Build APK through the actual Builder CLI
        env:
          BUILD_TIMEOUT_MS: "3600000"
        run: |
          set -o pipefail
          pnpm exec tsx lib/cli.ts community-chat-demo.zip 2>&1 | tee community-chat-builder-build.log

      - name: Validate APK, package ID, and SHA-256
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK under %s/output; found %s\n' "$GITHUB_WORKSPACE" "${#APK_FILES[@]}" >&2
            printf '%s\n' "${APK_FILES[@]}" >&2
            exit 1
          fi
          APK="${APK_FILES[0]}"
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -qx 'assets/index.android.bundle'
          aapt dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/apk-sha256.txt"
          stat -c 'APK_SIZE_BYTES=%s' "$APK" | tee "$GITHUB_WORKSPACE/apk-size.txt"
          printf 'APK_PATH=%s\n' "$APK" | tee "$GITHUB_WORKSPACE/apk-path.txt"
          PACKAGE_ID="$(awk -F "\047" '/^package:/ {print $2; exit}' "$GITHUB_WORKSPACE/apk-badging.txt")"
          test "$PACKAGE_ID" = "com.communitychatdemo"
          {
            echo "## Community Chat Demo — Builder APK"
            echo
            echo "- Source commit: $SOURCE_COMMIT"
            echo "- Workflow SHA: $WORKFLOW_SHA"
            echo "- APK: $APK"
            echo "- $(cat "$GITHUB_WORKSPACE/apk-size.txt")"
            echo "- SHA-256: $(awk '{print $1}' "$GITHUB_WORKSPACE/apk-sha256.txt")"
            echo "- Package: $PACKAGE_ID"
            echo "- Device install/launch/interaction: NOT RUN in cloud CI"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(cat "$GITHUB_WORKSPACE/apk-path.txt" | sed 's/^APK_PATH=//')"
          test -s "$APK_PATH"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk = Path(os.environ["GITHUB_WORKSPACE"]) / "output" / Path(os.environ.get("APK_PATH_BASENAME", "")).name if os.environ.get("APK_PATH_BASENAME") else Path(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "apk-path.txt"), encoding="utf-8").read().strip().split("=", 1)[1])
          if not apk.is_file() or apk.stat().st_size <= 0:
              raise SystemExit(f"APK missing or empty: {apk}")
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          aapt = os.path.join(sdk, "build-tools", "35.0.0", "aapt")
          badging = subprocess.check_output([aapt, "dump", "badging", str(apk)], text=True)
          package_id = next((line.split("name='", 1)[1].split("'", 1)[0] for line in badging.splitlines() if line.startswith("package: name='")), None)
          if package_id != "com.communitychatdemo":
              raise SystemExit(f"Unexpected package ID: {package_id}")
          provenance = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "application_id": package_id,
              "artifact": {
                  "path": str(apk.relative_to(Path(os.environ["GITHUB_WORKSPACE"]))),
                  "size_bytes": apk.stat().st_size,
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              },
              "ci_build": True,
              "real_device_acceptance": "NOT_RUN",
          }
          Path("apk-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(provenance, indent=2))
          PY

      - name: Enforce APK identity and provenance gate
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(sed 's/^APK_PATH=//' "$GITHUB_WORKSPACE/apk-path.txt")"
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance apk-provenance.json \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-application-id "com.communitychatdemo" \
            --registry docs/tested-apk-registry.json \
            --output community-chat-apk-identity-gate-report.json

      - name: Upload Builder APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: community-chat-demo-builder-apk
          path: |
            output/*.apk
            community-chat-demo.zip
            community-chat-builder-build.log
            apk-badging.txt
            apk-sha256.txt
            apk-size.txt
            apk-path.txt
            apk-provenance.json
            community-chat-apk-identity-gate-report.json
          if-no-files-found: error
          retention-days: 14
