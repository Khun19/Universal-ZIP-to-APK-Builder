name: Dependency Lockfile Refresh (temporary PR helper)

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-lockfile-refresh.yml'
      - 'scripts/ci/merge-preserved-lockfile.rb'

permissions:
  contents: read

concurrency:
  group: dependency-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Preserve baseline lockfile
        run: cp pnpm-lock.yaml pnpm-lock.before.yaml

      - name: Regenerate lockfile from current PR workspace
        run: pnpm install --lockfile-only --config.node-linker=hoisted

      - name: Restore protected M6 importer and validate patched dependency
        run: ruby scripts/ci/merge-preserved-lockfile.rb

      - name: Validate frozen lockfile install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted --ignore-scripts

      - name: Check patched esbuild and protected M6 importer
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '  esbuild: 0.28.1' pnpm-lock.yaml
          grep -Fq '  .workspace/m6-react-native-direct-integration:' pnpm-lock.yaml
          ! grep -Fq 'esbuild@0.27.3' pnpm-lock.yaml
          ! grep -Fq 'esbuild: 0.27.3' pnpm-lock.yaml

      - name: Upload regenerated lockfile for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lockfile-refresh-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
