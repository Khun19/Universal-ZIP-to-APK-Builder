name: Test A runtime bridge finalization

on:
  push:
    branches:
      - fix/test-a-runtime-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply Android SAF bridge
        run: python3 scripts/patch-test-a-directory-picker.py

      - name: Verify generated template
        run: |
          set -e
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' lib/template.ts
          grep -q 'AndroidDirectoryBridge' lib/template.ts
          grep -q 'androidx.documentfile:documentfile:1.0.1' lib/template.ts
          grep -q 'showDirectoryPicker' lib/template.ts
          grep -q 'createWritable' lib/template.ts
          grep -q 'createDirectory' lib/template.ts
          grep -q 'readFile' lib/template.ts
          grep -q 'writeFile' lib/template.ts
          grep -q 'removeEntry' lib/template.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Commit generated source
        run: |
          rm -f .github/workflows/fix-test-a-runtime-final.yml scripts/patch-test-a-directory-picker.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/template.ts .github/workflows/fix-test-a-runtime-final.yml scripts/patch-test-a-directory-picker.py
          git diff --cached --quiet && exit 0 || true
          git commit -m 'fix(test-a): finalize Android SAF directory picker bridge'
          git push origin HEAD:fix/test-a-runtime-final
