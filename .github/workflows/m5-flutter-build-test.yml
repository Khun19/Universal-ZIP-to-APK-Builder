name: M5 Flutter Build Test

on:
  push:
    branches:
      - feat/main-m5-flutter-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-flutter-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          java -version
          node --version
          pnpm --version
          flutter --version
          flutter doctor -v

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Run M5 Flutter pipeline integration
        env:
          RUN_ANDROID_INTEGRATION: '1'
        run: pnpm exec tsx --test tests/flutter-pipeline.test.ts

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find . -type f -name '*.apk' -not -path './node_modules/*' -print -quit)"
          test -n "$apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          sha256sum "$apk_path"
          unzip -t "$apk_path"
          aapt dump badging "$apk_path"

      - name: Create build provenance
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk_path = Path(os.environ["APK_PATH"])
          apk_hash = hashlib.sha256(apk_path.read_bytes()).hexdigest()
          apk_size = apk_path.stat().st_size
          java_version = subprocess.check_output(
              ["java", "-version"], text=True, stderr=subprocess.STDOUT
          ).splitlines()[0]
          flutter_version = subprocess.check_output(
              ["flutter", "--version"], text=True, stderr=subprocess.STDOUT
          ).splitlines()[0]

          record = {
              "schema_version": 1,
              "milestone": "M5",
              "framework": "Flutter",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "commit_sha": os.environ["COMMIT_SHA"],
              "flutter_version": flutter_version,
              "java_version": java_version,
              "apk_path": str(apk_path),
              "apk_size_bytes": apk_size,
              "apk_sha256": apk_hash,
          }
          Path("m5-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("m5-apk.sha256").write_text(
              f"{apk_hash}  {apk_path}\n", encoding="utf-8"
          )
          PY

      - name: Validate M5 provenance and checksum
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m json.tool m5-provenance.json >/dev/null
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          record = json.loads(Path("m5-provenance.json").read_text(encoding="utf-8"))
          apk = Path(os.environ["APK_PATH"])
          actual_hash = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert record["commit_sha"] == os.environ["COMMIT_SHA"], "provenance commit mismatch"
          assert record["apk_size_bytes"] == apk.stat().st_size, "APK size mismatch"
          assert record["apk_sha256"] == actual_hash, "APK SHA-256 mismatch"
          sidecar = Path("m5-apk.sha256").read_text(encoding="utf-8").split()
          assert sidecar[0] == actual_hash, "checksum sidecar mismatch"
          print("M5 provenance JSON, exact commit, APK size, and SHA-256 validated")
          PY

      - name: Upload M5 APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m5-flutter-apk
          path: |
            ${{ steps.apk.outputs.path }}
            m5-provenance.json
            m5-apk.sha256
          if-no-files-found: error
          retention-days: 14
