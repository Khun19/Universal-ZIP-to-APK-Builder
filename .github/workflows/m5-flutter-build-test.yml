name: M5 Flutter Build Test

on:
  push:
    branches:
      - feat/main-m5-flutter-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-flutter-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          java -version
          node --version
          pnpm --version
          flutter --version
          flutter doctor -v

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Run M5 Flutter pipeline integration
        env:
          RUN_ANDROID_INTEGRATION: '1'
        run: pnpm exec tsx --test tests/flutter-pipeline.test.ts

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find . -type f -name '*.apk' -not -path './node_modules/*' -print -quit)"
          test -n "$apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          sha256sum "$apk_path"
          unzip -t "$apk_path"
          aapt dump badging "$apk_path"

      - name: Create build provenance
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk_sha="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          apk_size="$(stat -c '%s' "$APK_PATH")"
          cat > m5-provenance.json <<EOF
          {
            "milestone": "M5",
            "framework": "Flutter",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "commit_sha": "${COMMIT_SHA}",
            "flutter_version": "$(flutter --version | head -n 1)",
            "java_version": "$(java -version 2>&1 | head -n 1)",
            "apk_path": "${APK_PATH}",
            "apk_size_bytes": ${apk_size},
            "apk_sha256": "${apk_sha}"
          }
          EOF
          cat m5-provenance.json
          printf '%s  %s\n' "$apk_sha" "$APK_PATH" > m5-apk.sha256

      - name: Upload M5 APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m5-flutter-apk
          path: |
            ${{ steps.apk.outputs.path }}
            m5-provenance.json
            m5-apk.sha256
          if-no-files-found: error
          retention-days: 14
