name: Nested Expo Android Build Fixture

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/project-layout.ts'
      - 'lib/server.ts'
      - 'lib/worker.ts'
      - 'tests/project-layout.test.ts'
      - 'tests/fixtures/nested-expo-monorepo/**'
      - '.github/workflows/nested-expo-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/project-layout.ts'
      - 'lib/server.ts'
      - 'lib/worker.ts'
      - 'tests/project-layout.test.ts'
      - 'tests/fixtures/nested-expo-monorepo/**'
      - '.github/workflows/nested-expo-build.yml'

permissions:
  contents: read

concurrency:
  group: nested-expo-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-android:
    name: Nested Expo app — real debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure runner-provided Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Record exact source and toolchain
        run: |
          echo "SOURCE_SHA=$GITHUB_SHA"
          node --version
          pnpm --version
          java -version
          sdkmanager --list_installed

      - name: Install fixture workspace dependencies
        run: pnpm install --no-frozen-lockfile --config.node-linker=hoisted
        working-directory: tests/fixtures/nested-expo-monorepo

      - name: Generate native Android project from nested Expo app
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: tests/fixtures/nested-expo-monorepo/artifacts/focus-mode

      - name: Build real debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android

      - name: Validate APK and calculate SHA-256
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "AndroidManifest.xml"
          echo "APK_PATH=$APK" >> "$GITHUB_OUTPUT"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f1)" | tee apk-evidence.txt
          stat --printf='APK_SIZE_BYTES=%s\n' "$APK" | tee -a apk-evidence.txt
          echo "SOURCE_SHA=$GITHUB_SHA" | tee -a apk-evidence.txt
          echo "BUILD_STATUS=APK_PRESENT_AND_MANIFEST_VALID" | tee -a apk-evidence.txt

      - name: Install and launch APK in Android Emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            APK="tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.rzbuilder.fixture.focusmode"
            adb wait-for-device
            adb install -r "$APK" > emulator-install.txt 2>&1
            install_rc=$?
            if [ "$install_rc" -eq 0 ]; then
              adb shell monkey -p "$PACKAGE" 1 > emulator-launch.txt 2>&1
              launch_rc=$?
              sleep 8
              adb shell pidof "$PACKAGE" > emulator-process.txt 2>&1
              process_rc=$?
              adb exec-out screencap -p > emulator-screenshot.png 2>/dev/null
              adb logcat -d > emulator-logcat.txt 2>&1
            else
              launch_rc=99
              process_rc=99
              printf 'Install failed; launch not attempted.\n' > emulator-launch.txt
              adb logcat -d > emulator-logcat.txt 2>&1
            fi
            {
              echo "SOURCE_SHA=$GITHUB_SHA"
              echo "APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f1)"
              echo "EMULATOR_API=35"
              echo "EMULATOR_ABI=x86_64"
              echo "INSTALL_EXIT_CODE=$install_rc"
              echo "LAUNCH_EXIT_CODE=$launch_rc"
              echo "PROCESS_CHECK_EXIT_CODE=$process_rc"
            } | tee -a apk-evidence.txt
            test "$install_rc" -eq 0 && test "$launch_rc" -eq 0 && test "$process_rc" -eq 0

      - name: Upload APK and build/emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-expo-debug-apk-${{ github.sha }}
          path: |
            tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk
            apk-evidence.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-process.txt
            emulator-screenshot.png
            emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
