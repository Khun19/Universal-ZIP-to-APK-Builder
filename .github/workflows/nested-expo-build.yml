name: Nested Expo Emulator Readiness Pilot

on:
  pull_request:
    branches: [main, fix/issue-104-nested-app-root-20261028]
    paths:
      - 'lib/project-layout.ts'
      - 'lib/server.ts'
      - 'lib/worker.ts'
      - 'tests/project-layout.test.ts'
      - 'tests/fixtures/nested-expo-monorepo/**'
      - '.github/workflows/nested-expo-build.yml'
      - 'scripts/ci/test-nested-expo-emulator.sh'
      - 'docs/VALIDATION-WORKFLOW.md'
  push:
    branches: [main]
    paths:
      - 'lib/project-layout.ts'
      - 'lib/server.ts'
      - 'lib/worker.ts'
      - 'tests/project-layout.test.ts'
      - 'tests/fixtures/nested-expo-monorepo/**'
      - '.github/workflows/nested-expo-build.yml'
      - 'scripts/ci/test-nested-expo-emulator.sh'
      - 'docs/VALIDATION-WORKFLOW.md'

permissions:
  contents: read

concurrency:
  group: nested-expo-emulator-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-emulator-pilot:
    name: Nested Expo APK — Emulator readiness pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit and merge parents
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure runner-provided Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Diagnose host network, DNS, HTTPS, and proxy configuration
        id: network-preflight
        shell: bash
        run: |
          set +e
          REPORT=network-diagnostics.txt
          {
            echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "CLASSIFICATION=NETWORK_OR_DEPENDENCY_SETUP"
            for name in dl.google.com redirector.gvt1.com registry.npmjs.org; do
              echo "DNS_HOST=$name"
              getent ahosts "$name" 2>&1
              echo "DNS_EXIT_CODE=$?"
            done
            for url in https://dl.google.com/android/repository/repository2-1.xml https://registry.npmjs.org/; do
              echo "HTTPS_URL=$url"
              curl --location --silent --show-error --output /dev/null --max-time 20 --write-out 'HTTP_CODE=%{http_code} DNS_SECONDS=%{time_namelookup} CONNECT_SECONDS=%{time_connect} TLS_SECONDS=%{time_appconnect} TOTAL_SECONDS=%{time_total}\n' "$url"
              echo "HTTPS_EXIT_CODE=$?"
            done
            if [ -n "${HTTPS_PROXY:-}${https_proxy:-}${HTTP_PROXY:-}${http_proxy:-}${ALL_PROXY:-}${all_proxy:-}" ]; then
              echo "PROXY_CONFIGURED=true"
            else
              echo "PROXY_CONFIGURED=false"
            fi
            echo "PROXY_VALUES_REDACTED=true"
          } > "$REPORT" 2>&1
          cat "$REPORT"
          # Diagnostics are non-fatal by themselves; later SDK/dependency step outcomes
          # decide whether setup is blocked. Never infer an Emulator failure from DNS.
          exit 0

      - name: Install Android platform and build tools
        id: sdk-install
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          start_ms="$(date +%s%3N)"
          set +e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > sdk-install.log 2>&1
          rc=$?
          set -e
          end_ms="$(date +%s%3N)"
          {
            echo "SDK_INSTALL_EXIT_CODE=$rc"
            echo "SDK_INSTALL_DURATION_MS=$((end_ms - start_ms))"
            if [ "$rc" -eq 0 ]; then
              echo "SDK_SETUP_RESULT=PASS"
            else
              echo "SDK_SETUP_RESULT=FAIL"
              echo "FAILURE_PHASE=SDK_SETUP_OR_PACKAGE_DOWNLOAD"
            fi
          } | tee -a sdk-install.log
          cat sdk-install.log
          exit "$rc"

      - name: Record exact source and toolchain
        run: |
          echo "SOURCE_SHA=$GITHUB_SHA"
          node --version
          pnpm --version
          java -version
          sdkmanager --list_installed

      - name: Record host resource baseline
        shell: bash
        run: |
          {
            echo "CAPTURED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "DISK_USAGE"
            df -h "$GITHUB_WORKSPACE" /tmp
            echo "MEMORY"
            free -h
            echo "CPU"
            nproc
            echo "LOAD_AVERAGE"
            cat /proc/loadavg
          } > host-resource-baseline.txt
          cat host-resource-baseline.txt

      - name: Install fixture workspace dependencies
        run: |
          set +e
          start_ms="$(date +%s%3N)"
          pnpm install --no-frozen-lockfile --config.node-linker=hoisted > "$GITHUB_WORKSPACE/dependency-install.log" 2>&1
          rc=$?
          end_ms="$(date +%s%3N)"
          {
            echo "DEPENDENCY_INSTALL_EXIT_CODE=$rc"
            echo "DEPENDENCY_INSTALL_DURATION_MS=$((end_ms - start_ms))"
            if [ "$rc" -eq 0 ]; then
              echo "DEPENDENCY_SETUP_RESULT=PASS"
            else
              echo "DEPENDENCY_SETUP_RESULT=FAIL"
              echo "FAILURE_PHASE=DEPENDENCY_SETUP"
            fi
          } | tee -a "$GITHUB_WORKSPACE/dependency-install.log"
          cat "$GITHUB_WORKSPACE/dependency-install.log"
          exit "$rc"
        working-directory: tests/fixtures/nested-expo-monorepo

      - name: Generate native Android project from nested Expo app
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: tests/fixtures/nested-expo-monorepo/artifacts/focus-mode

      - name: Build real debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android

      - name: Validate APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "AndroidManifest.xml"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f1)" | tee apk-evidence.txt
          stat --printf='APK_SIZE_BYTES=%s\n' "$APK" | tee -a apk-evidence.txt
          echo "SOURCE_SHA=$GITHUB_SHA" | tee -a apk-evidence.txt
          echo "BUILD_STATUS=APK_PRESENT_AND_MANIFEST_VALID" | tee -a apk-evidence.txt

      - name: Validate APK identity and write provenance
        id: apk-provenance
        shell: bash
        env:
          EXPECTED_PACKAGE: com.rzbuilder.fixture.focusmode
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_EVENT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          APK="tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > apk-zip-validation.txt
          unzip -Z1 "$APK" | grep -Fx "AndroidManifest.xml"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='$EXPECTED_PACKAGE'" apk-badging.txt
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f1)"
          APK_SIZE_BYTES="$(stat --printf='%s' "$APK")"
          PR_BASE_SHA="$(git rev-parse HEAD^1)"
          FIXTURE_LOCKFILE="tests/fixtures/nested-expo-monorepo/pnpm-lock.yaml"
          if [[ -s "$FIXTURE_LOCKFILE" ]]; then
            FIXTURE_LOCKFILE_SHA256="$(sha256sum "$FIXTURE_LOCKFILE" | cut -d ' ' -f1)"
          else
            FIXTURE_LOCKFILE_SHA256="NOT_FOUND"
          fi
          NODE_VERSION="$(node --version)"
          PNPM_VERSION="$(pnpm --version)"
          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"
          GRADLE_VERSION="$(cd tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android && ./gradlew --version | awk '/^Gradle / {print $2; exit}')"
          export PR_BASE_SHA FIXTURE_LOCKFILE_SHA256 NODE_VERSION PNPM_VERSION JAVA_VERSION GRADLE_VERSION
          echo "APK_SHA256=$APK_SHA256" | tee -a apk-evidence.txt
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" | tee -a apk-evidence.txt
          echo "SOURCE_SHA=$GITHUB_SHA" | tee -a apk-evidence.txt
          echo "BUILD_STATUS=APK_ZIP_MANIFEST_PACKAGE_AND_HASH_VALID" | tee -a apk-evidence.txt
          export APK APK_SHA256 APK_SIZE_BYTES EXPECTED_PACKAGE PR_HEAD_SHA PR_BASE_EVENT_SHA
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fixture = Path("tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/package.json")
          package = json.loads(fixture.read_text(encoding="utf-8"))
          import hashlib
          record = {
              "schema_version": 1,
              "evidence_type": "nested-expo-apk-build-and-emulator-pilot",
              "source_commit_sha": os.environ["GITHUB_SHA"],
              "pull_request_head_sha": os.environ["PR_HEAD_SHA"],
              "pull_request_base_sha": os.environ["PR_BASE_SHA"],
              "pull_request_event_base_sha": os.environ["PR_BASE_EVENT_SHA"],
              "project_source_commit_sha": os.environ["PR_BASE_SHA"],
              "workflow_head_sha": os.environ["PR_HEAD_SHA"],
              "fixture_package_json_sha256": hashlib.sha256(fixture.read_bytes()).hexdigest(),
              "fixture_lockfile_path": "tests/fixtures/nested-expo-monorepo/pnpm-lock.yaml",
              "fixture_lockfile_sha256": os.environ["FIXTURE_LOCKFILE_SHA256"],
              "dependency_lock_policy": "pnpm install --no-frozen-lockfile",
              "toolchain": {
                  "node": os.environ["NODE_VERSION"],
                  "pnpm": os.environ["PNPM_VERSION"],
                  "java": os.environ["JAVA_VERSION"],
                  "gradle": os.environ["GRADLE_VERSION"]
              },
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "framework": "Expo",
              "framework_version": package.get("dependencies", {}).get("expo", "UNKNOWN"),
              "application_id": os.environ["EXPECTED_PACKAGE"],
              "apk_path": os.environ["APK"],
              "apk_size_bytes": int(os.environ["APK_SIZE_BYTES"]),
              "apk_sha256": os.environ["APK_SHA256"],
              "emulator": {"api_level": 35, "abi": "x86_64", "profile": "pixel_2"},
              "build_status": "PASS",
              "provenance_status": "PASS",
              "emulator_acceptance_status": "PENDING",
              "physical_device_acceptance_status": "NOT_RUN"
          }
          Path("nested-expo-provenance.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Run Emulator readiness pilot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash scripts/ci/test-nested-expo-emulator.sh

      - name: Verify Emulator result matches exact APK provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s nested-expo-provenance.json || ! -s emulator-result.json ]]; then
            echo "EMULATOR_ACCEPTANCE_STATUS=BLOCKED_EVIDENCE"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path("nested-expo-provenance.json").read_text())
          result = json.loads(Path("emulator-result.json").read_text())
          assert result["source_sha"] == provenance["source_commit_sha"], "Emulator source SHA does not match APK provenance"
          assert result["apk_sha256"] == provenance["apk_sha256"], "Emulator APK SHA-256 does not match built APK"
          status = result["status"]
          provenance["emulator_acceptance_status"] = status
          provenance["emulator_result"] = result
          Path("nested-expo-provenance.json").write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n")
          print(f"EMULATOR_ACCEPTANCE_STATUS={status}")
          if status == "PASS":
              assert result["install_exit_code"] == "0"
              assert result["launch_exit_code"] == "0"
              assert result["process_check_exit_code"] == "0"
              assert result["screenshot_exit_code"] == "0"
          PY

      - name: Upload APK and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nested-expo-emulator-pilot-${{ github.sha }}
          path: |
            tests/fixtures/nested-expo-monorepo/artifacts/focus-mode/android/app/build/outputs/apk/debug/app-debug.apk
            apk-evidence.txt
            apk-zip-validation.txt
            apk-badging.txt
            nested-expo-provenance.json
            network-diagnostics.txt
            sdk-install.log
            dependency-install.log
            host-resource-baseline.txt
            emulator-health.txt
            emulator-adb-before.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-process.txt
            emulator-screenshot.png
            emulator-logcat.txt
            emulator-result.json
          if-no-files-found: warn
          retention-days: 7
