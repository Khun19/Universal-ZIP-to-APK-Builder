name: Test A SAF bridge patch runner

on:
  push:
    branches:
      - fix/test-a-directory-picker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out commit
        run: |
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Normalize WebViewClient anchor for deterministic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/template.ts')
          s = p.read_text()

          marker = '''            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view, String url) {
                return assetLoader.shouldInterceptRequest(Uri.parse(url));
            }
'''

          if marker in s:
              print('anchor already present')
          elif 'return assetLoader.shouldInterceptRequest(Uri.parse(url));' in s:
              pattern = r'(return assetLoader\.shouldInterceptRequest\(Uri\.parse\(url\)\);\n\s*\})'
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit('asset loader return found, but method closing brace could not be located')
              s = s[:m.start()] + marker.rstrip('\n') + s[m.end():]
              p.write_text(s)
              print('inserted deterministic String-url WebViewClient anchor')
          else:
              raise SystemExit('asset loader shouldInterceptRequest return not found')
          PY

      - name: Apply complete Android SAF bridge
        run: python3 scripts/patch-test-a-directory-picker.py

      - name: Verify bridge source
        run: |
          set -e
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' lib/template.ts
          grep -q 'AndroidDirectoryBridge' lib/template.ts
          grep -q 'androidx.documentfile:documentfile:1.0.1' lib/template.ts
          grep -q 'showDirectoryPicker' lib/template.ts
          grep -q 'createWritable' lib/template.ts
          grep -q 'createDirectory' lib/template.ts
          grep -q 'readFile' lib/template.ts
          grep -q 'writeFile' lib/template.ts
          grep -q 'removeEntry' lib/template.ts
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Commit generated source
        run: |
          rm -f .github/workflows/one-time-test-a-directory-picker.yml .test-a-saf-trigger scripts/patch-test-a-directory-picker.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/template.ts .github/workflows/one-time-test-a-directory-picker.yml .test-a-saf-trigger scripts/patch-test-a-directory-picker.py
          git commit -m 'fix(test-a): add Android SAF directory picker bridge'
          git push origin fix/test-a-directory-picker
