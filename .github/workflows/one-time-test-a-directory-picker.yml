          s = s.replace(old, new, 1)

          old = '''        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);'''
          new = '''        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        directoryWebView = webView;
        webView.addJavascriptInterface(new DirectoryBridge(), "AndroidDirectoryBridge");'''
          assert old in s, 'expected WebView settings block not found'
          s = s.replace(old, new, 1)

          old = '''        webView.loadUrl("https://appassets.androidplatform.net/index.html");
        setContentView(webView);'''
          new = '''        webView.setWebViewClient(new WebViewClient() {
            @Override
            public void onPageFinished(WebView view, String url) {
                super.onPageFinished(view, url);
                view.evaluateJavascript(
                    "(function(){"
                    + "if(window.__androidDirectoryBridgeInstalled)return;"
                    + "window.__androidDirectoryBridgeInstalled=true;"
                    + "function b64bytes(s){var raw=atob(s||'');var a=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}"
                    + "function b64data(data){return data.arrayBuffer().then(function(buf){var a=new Uint8Array(buf),bin='';for(var i=0;i<a.length;i++)bin+=String.fromCharCode(a[i]);return btoa(bin);});}"
                    + "function join(a,b){return a? a+'/'+b : b;}"
                    + "function dirHandle(path,name){"
                    + "var h={kind:'directory',name:name||AndroidDirectoryBridge.getRootName()};"
                    + "h.queryPermission=function(){return Promise.resolve('granted')};"
                    + "h.requestPermission=function(){return Promise.resolve('granted')};"
                    + "h.getDirectoryHandle=function(n,o){var p=join(path,n),items=JSON.parse(AndroidDirectoryBridge.list(path)||'[]'),x=items.find(function(i){return i.name===n&&i.kind==='directory'});if(x)return Promise.resolve(dirHandle(p,n));if(o&&o.create&&AndroidDirectoryBridge.createDirectory(p))return Promise.resolve(dirHandle(p,n));return Promise.reject(new DOMException('Directory not found','NotFoundError'));};"
                    + "h.getFileHandle=function(n,o){var p=join(path,n),items=JSON.parse(AndroidDirectoryBridge.list(path)||'[]'),x=items.find(function(i){return i.name===n&&i.kind==='file'});if(x)return Promise.resolve(fileHandle(p,n,x.size));if(o&&o.create&&AndroidDirectoryBridge.createFile(p,'application/octet-stream'))return Promise.resolve(fileHandle(p,n,0));return Promise.reject(new DOMException('File not found','NotFoundError'));};"
                    + "h.removeEntry=function(n,o){var p=join(path,n);if(AndroidDirectoryBridge.remove(p))return Promise.resolve();return Promise.reject(new DOMException('Unable to remove entry','InvalidModificationError'));};"
                    + "h.resolve=function(other){return Promise.resolve(other&&other.__androidPath?other.__androidPath.split('/').filter(Boolean):null)};"
                    + "h.entries=function(){var items=JSON.parse(AndroidDirectoryBridge.list(path)||'[]'),i=0;return {next:function(){if(i>=items.length)return Promise.resolve({done:true});var x=items[i++],p=join(path,x.name);var v=x.kind==='directory'?dirHandle(p,x.name):fileHandle(p,x.name,x.size);v.__androidPath=p;return Promise.resolve({done:false,value:[x.name,v]})},[Symbol.asyncIterator]:function(){return this}}};"
                    + "h.keys=function(){var it=h.entries();return {next:function(){return it.next().then(function(x){return x.done?x:{done:false,value:x.value[0]}})},[Symbol.asyncIterator]:function(){return this}}};"
                    + "h.values=function(){var it=h.entries();return {next:function(){return it.next().then(function(x){return x.done?x:{done:false,value:x.value[1]}})},[Symbol.asyncIterator]:function(){return this}}};"
                    + "h.__androidPath=path;return h;"
                    + "}"
                    + "function fileHandle(path,name,size){var h={kind:'file',name:name};h.queryPermission=function(){return Promise.resolve('granted')};h.requestPermission=function(){return Promise.resolve('granted')};h.getFile=function(){var b=AndroidDirectoryBridge.readFile(path);if(!b&&size>0)return Promise.reject(new Error('Unable to read file'));var bytes=b64bytes(b);return Promise.resolve(new File([bytes],name,{type:'application/octet-stream',lastModified:Date.now()}));};h.createWritable=function(){var chunks=[];return Promise.resolve({write:function(data){if(typeof data==='string'){chunks.push(new TextEncoder().encode(data));return Promise.resolve();}if(data instanceof Blob)return data.arrayBuffer().then(function(x){chunks.push(new Uint8Array(x));});if(data instanceof ArrayBuffer){chunks.push(new Uint8Array(data));return Promise.resolve();}if(ArrayBuffer.isView(data)){chunks.push(new Uint8Array(data.buffer,data.byteOffset,data.byteLength));return Promise.resolve();}return Promise.reject(new TypeError('Unsupported writable data'));},close:function(){var total=0;chunks.forEach(function(x){total+=x.length});var out=new Uint8Array(total),o=0;chunks.forEach(function(x){out.set(x,o);o+=x.length});var bin='';for(var i=0;i<out.length;i++)bin+=String.fromCharCode(out[i]);var ok=AndroidDirectoryBridge.writeFile(path,btoa(bin),'application/octet-stream');return ok?Promise.resolve():Promise.reject(new Error('Unable to write file'));},abort:function(){chunks=[];return Promise.resolve();}})};h.__androidPath=path;return h;}"
                    + "window.__androidDirectoryPickerResolve=null;"
                    + "window.__androidDirectoryPickerResult=function(ok){var r=window.__androidDirectoryPickerResolve;window.__androidDirectoryPickerResolve=null;if(r)r(ok?dirHandle('',AndroidDirectoryBridge.getRootName()):null);};"
                    + "window.showDirectoryPicker=function(){return new Promise(function(resolve){window.__androidDirectoryPickerResolve=resolve;AndroidDirectoryBridge.pickDirectory();});};"
                    + "})();", null
                );
            }
        });

        webView.loadUrl("https://appassets.androidplatform.net/index.html");
        setContentView(webView);'''
