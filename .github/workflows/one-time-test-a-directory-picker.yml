name: Test A SAF bridge patch runner

on:
  push:
    branches:
      - fix/test-a-directory-picker

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(test-a): add Android SAF directory picker bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-a-directory-picker
          fetch-depth: 0

      - name: Apply complete Android SAF bridge
        env:
          PATCH_SCRIPT_B64: "PASTE_SCRIPT_B64"
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          script = base64.b64decode(os.environ['PATCH_SCRIPT_B64']).decode()
          exec(compile(script, 'patch-test-a.py', 'exec'))
          PY

      - name: Verify bridge source
        run: |
          set -e
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' lib/template.ts
          grep -q 'AndroidDirectoryBridge' lib/template.ts
          grep -q 'androidx.documentfile:documentfile:1.0.1' lib/template.ts
          grep -q 'showDirectoryPicker' lib/template.ts
          grep -q 'createWritable' lib/template.ts
          grep -q 'createDirectory' lib/template.ts
          grep -q 'readFile' lib/template.ts
          grep -q 'writeFile' lib/template.ts
          grep -q 'removeEntry' lib/template.ts
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/one-time-test-a-directory-picker.yml .test-a-saf-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/template.ts .github/workflows/one-time-test-a-directory-picker.yml .test-a-saf-trigger
          git commit -m 'fix(test-a): add Android SAF directory picker bridge'
          git push origin fix/test-a-directory-picker
