name: Test A SAF bridge patch runner

on:
  push:
    branches: [fix/test-a-directory-picker]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-a-directory-picker
          fetch-depth: 0
      - name: Verify workflow runner
        run: |
          echo "Test A SAF patch runner started"
          test -f lib/template.ts
          grep -q 'androidx.webkit:webkit:1.12.1' lib/template.ts
          echo "template source is present"
