name: One-time Test A directory picker patch

on:
  push:
    branches:
      - fix/test-a-directory-picker

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(test-a): add Android SAF directory picker bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-a-directory-picker
          fetch-depth: 0

      - name: Patch complete Android SAF File System Access compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/template.ts')
          s = p.read_text()

          old = '''import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.res.AssetManager;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;'''
          new = '''import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.res.AssetManager;
import android.net.Uri;
import android.os.Bundle;
import android.util.Base64;
import android.webkit.JavascriptInterface;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;'''
          assert old in s, 'expected import block not found'
          s = s.replace(old, new, 1)

          old = '''import java.io.InputStream;

public class MainActivity {
    private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
    private ValueCallback<Uri[]> filePathCallback;'''
          new = '''import java.io.ByteArrayOutputStream;
import java.io.InputStream;
import java.io.OutputStream;
import org.json.JSONArray;
import org.json.JSONObject;
import androidx.documentfile.provider.DocumentFile;

public class MainActivity {
    private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
    private static final int DIRECTORY_PICKER_REQUEST_CODE = 1002;
    private ValueCallback<Uri[]> filePathCallback;
    private WebView directoryWebView;
    private Uri directoryTreeUri;

    private final class DirectoryBridge {
        private String cleanPath(String value) {
            if (value == null || value.length() == 0) return "";
            String normalized = value.replace('\\\\', '/');
            while (normalized.startsWith("/")) normalized = normalized.substring(1);
            while (normalized.endsWith("/")) normalized = normalized.substring(0, normalized.length() - 1);
            if (normalized.length() == 0) return "";
            String[] parts = normalized.split("/");
            StringBuilder out = new StringBuilder();
            for (String part : parts) {
                if (part.length() == 0 || ".".equals(part)) continue;
                if ("..".equals(part)) throw new IllegalArgumentException("Invalid path");
                if (out.length() > 0) out.append('/');
                out.append(part);
            }
            return out.toString();
        }

        private DocumentFile root() {
            if (directoryTreeUri == null) return null;
            return DocumentFile.fromTreeUri(MainActivity.this, directoryTreeUri);
        }

        private DocumentFile document(String relativePath) {
            DocumentFile current = root();
            if (current == null) return null;
            String clean = cleanPath(relativePath);
            if (clean.length() == 0) return current;
            for (String part : clean.split("/")) {
                if (current == null || !current.isDirectory()) return null;
                current = current.findFile(part);
            }
            return current;
        }

        private DocumentFile parent(String relativePath) {
            String clean = cleanPath(relativePath);
            int slash = clean.lastIndexOf('/');
            return document(slash < 0 ? "" : clean.substring(0, slash));
        }

        private String leaf(String relativePath) {
            String clean = cleanPath(relativePath);
            int slash = clean.lastIndexOf('/');
            return slash < 0 ? clean : clean.substring(slash + 1);
        }

        @JavascriptInterface
        public void pickDirectory() {
            Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
            intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
            intent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
            intent.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
            intent.addFlags(Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
            try {
                startActivityForResult(intent, DIRECTORY_PICKER_REQUEST_CODE);
            } catch (ActivityNotFoundException error) {
                notifyDirectoryResult(false);
            }
        }

        @JavascriptInterface
        public String list(String relativePath) {
            try {
                DocumentFile dir = document(relativePath);
                if (dir == null || !dir.isDirectory()) return "[]";
                JSONArray result = new JSONArray();
                for (DocumentFile child : dir.listFiles()) {
                    JSONObject item = new JSONObject();
                    item.put("name", child.getName() == null ? "" : child.getName());
                    item.put("kind", child.isDirectory() ? "directory" : "file");
                    item.put("size", child.isFile() ? child.length() : 0);
                    result.put(item);
                }
                return result.toString();
            } catch (Exception error) {
                return "[]";
            }
        }

        @JavascriptInterface
        public String readFile(String relativePath) {
            try {
                DocumentFile file = document(relativePath);
                if (file == null || !file.isFile()) return "";
                InputStream input = getContentResolver().openInputStream(file.getUri());
                if (input == null) return "";
                ByteArrayOutputStream output = new ByteArrayOutputStream();
                byte[] buffer = new byte[8192];
                int count;
                while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count);
                input.close();
                return Base64.encodeToString(output.toByteArray(), Base64.NO_WRAP);
            } catch (Exception error) {
                return "";
            }
        }

        @JavascriptInterface
        public boolean createDirectory(String relativePath) {
            try {
                DocumentFile existing = document(relativePath);
                if (existing != null) return existing.isDirectory();
                DocumentFile parent = parent(relativePath);
                if (parent == null || !parent.isDirectory()) return false;
                return parent.createDirectory(leaf(relativePath)) != null;
            } catch (Exception error) {
                return false;
            }
        }

        @JavascriptInterface
        public boolean createFile(String relativePath, String mimeType) {
            try {
                DocumentFile existing = document(relativePath);
                if (existing != null) return existing.isFile();
                DocumentFile parent = parent(relativePath);
                if (parent == null || !parent.isDirectory()) return false;
                return parent.createFile(
                    mimeType == null || mimeType.length() == 0 ? "application/octet-stream" : mimeType,
                    leaf(relativePath)
                ) != null;
            } catch (Exception error) {
                return false;
            }
        }

        @JavascriptInterface
        public boolean writeFile(String relativePath, String base64Data, String mimeType) {
            try {
                DocumentFile file = document(relativePath);
                if (file == null || !file.isFile()) {
                    if (!createFile(relativePath, mimeType)) return false;
                    file = document(relativePath);
                }
                if (file == null) return false;
                byte[] data = Base64.decode(base64Data == null ? "" : base64Data, Base64.DEFAULT);
                OutputStream output = getContentResolver().openOutputStream(file.getUri(), "wt");
                if (output == null) return false;
                output.write(data);
                output.flush();
                output.close();
                return true;
            } catch (Exception error) {
                return false;
            }
        }

        @JavascriptInterface
        public boolean remove(String relativePath) {
            try {
                DocumentFile file = document(relativePath);
                return file != null && file.delete();
            } catch (Exception error) {
                return false;
            }
        }

        @JavascriptInterface
        public boolean rename(String relativePath, String newName) {
            try {
                DocumentFile file = document(relativePath);
                return file != null && newName != null && newName.indexOf('/') < 0 && file.renameTo(newName);
            } catch (Exception error) {
                return false;
            }
        }

        @JavascriptInterface
        public String getRootName() {
            DocumentFile root = root();
            return root == null || root.getName() == null ? "Selected folder" : root.getName();
        }

        private void notifyDirectoryResult(boolean ok) {
            if (directoryWebView == null) return;
            String js = "window.__androidDirectoryPickerResult(" + (ok ? "true" : "false") + ");";
            directoryWebView.post(() -> directoryWebView.evaluateJavascript(js, null));
        }
    }'''
