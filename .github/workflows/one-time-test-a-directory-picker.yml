      - name: Verify complete bridge and typecheck
        run: |
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' lib/template.ts
          grep -q 'AndroidDirectoryBridge' lib/template.ts
          grep -q 'androidx.documentfile:documentfile:1.0.1' lib/template.ts
          grep -q 'readFile' lib/template.ts
          grep -q 'writeFile' lib/template.ts
          grep -q 'createDirectory' lib/template.ts
          grep -q 'remove' lib/template.ts
          grep -q 'showDirectoryPicker' lib/template.ts
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-test-a-directory-picker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/template.ts .github/workflows/one-time-test-a-directory-picker.yml
          git commit -m 'fix(test-a): add Android SAF directory picker bridge'
          git push origin fix/test-a-directory-picker
