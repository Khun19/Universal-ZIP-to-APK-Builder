name: SAF WebView Exact-Head Validation

on:
  pull_request:
    branches: [security/saf-webview-bridge-hardening]
    paths:
      - "scripts/saf-generated-project-validation.ts"
      - ".github/workflows/saf-webview-exact-head-validation.yml"
      - "docs/SAF-VALIDATION-EVIDENCE.md"
  push:
    branches: [validation/saf-webview-evidence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-saf-apk:
    name: Generate, compile, and attest SAF template
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SOURCE_SHA: c0221b0fd642c4137109297e53eb4afe9723a0db
      SAF_PROJECT_DIR: ${{ runner.temp }}/saf-generated-project
    steps:
      - name: Checkout PR #82 exact source
        uses: actions/checkout@v4
        with:
          repository: Khun19/Universal-ZIP-to-APK-Builder
          ref: c0221b0fd642c4137109297e53eb4afe9723a0db
          path: source
          persist-credentials: false

      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: validation
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Install validation harness dependencies
        working-directory: validation
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Set up JDK 17 and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Verify target identity and generate Android project
        shell: bash
        env:
          SAF_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/saf-validation-home"
          export HOME="$RUNNER_TEMP/saf-validation-home"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "VALIDATION_COMMIT=$(git -C validation rev-parse HEAD)" >> "$GITHUB_ENV"
          cd validation
          SAF_SOURCE_ROOT="$GITHUB_WORKSPACE/source" \
            SAF_PROJECT_DIR="$SAF_PROJECT_DIR" \
            ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            pnpm exec tsx scripts/saf-generated-project-validation.ts

      - name: Compile generated SAF Android project
        working-directory: ${{ runner.temp }}/saf-generated-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk

      - name: Create and verify exact-source provenance
        working-directory: ${{ runner.temp }}/saf-generated-project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path.cwd()
          apk = root / "app/build/outputs/apk/debug/app-debug.apk"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          record = {
            "schema_version": 1,
            "validation_scope": "PR82_SAF_WEBVIEW_GENERATED_TEMPLATE_COMPILE",
            "source_commit": os.environ["TARGET_SOURCE_SHA"],
            "validation_commit": os.environ["VALIDATION_COMMIT"],
            "workflow": os.environ["GITHUB_WORKFLOW"],
            "run_id": int(os.environ["GITHUB_RUN_ID"]),
            "fixture": "deterministic minimal HTML fixture generated by scripts/saf-generated-project-validation.ts",
            "application_id": "com.builder.safvalidation",
            "apk_path": str(apk),
            "artifact": {"sha256": digest, "size_bytes": apk.stat().st_size},
            "build_result": "PASS",
            "generated_source_validation": "PASS",
            "runtime_security": "NOT_RUN",
            "saf_functional_runtime": "NOT_RUN",
            "physical_device_acceptance": "NOT_RUN"
          }
          Path("saf-validation-provenance.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          Path("saf-validation-apk.sha256").write_text(f"{digest}  {apk.name}\n")
          reread = json.loads(Path("saf-validation-provenance.json").read_text())
          assert reread["source_commit"] == os.environ["TARGET_SOURCE_SHA"]
          assert reread["validation_commit"] == os.environ["VALIDATION_COMMIT"]
          assert reread["run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert reread["artifact"]["sha256"] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert reread["artifact"]["size_bytes"] == apk.stat().st_size
          print(json.dumps(reread, indent=2))
          PY

      - name: Upload APK and provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr82-saf-webview-generated-apk
          path: |
            ${{ runner.temp }}/saf-generated-project/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/saf-generated-project/saf-validation-provenance.json
            ${{ runner.temp }}/saf-generated-project/saf-validation-apk.sha256
          if-no-files-found: error
          retention-days: 14
