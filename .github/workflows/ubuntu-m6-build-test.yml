name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-theme
      - fix/m6-runtime-interaction
      - feat/main-m2-m6-framework-integration
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Export Android env vars
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify React Native native toolchains
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/ndk/25.2.9519653/build/cmake/android.toolchain.cmake"
          test -f "$SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/ninja"
          echo "Verified NDK 25.2.9519653, NDK 26.1.10909125, CMake 3.22.1 and Ninja."

      - name: Add Android build-tools to PATH
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH; fi

      - name: Show resolved toolchain
        run: |
          java -version
          node --version
          pnpm --version
          sdkmanager --list_installed
          find . -path '*/gradle/wrapper/gradle-wrapper.properties' -print

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Resolve source and workflow commit identities
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
          test -n "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"
          if [[ -n "$PUSH_BEFORE_SHA" ]]; then
            echo "PUSH_BEFORE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
          fi
          echo "Source commit: $SOURCE_COMMIT"
          echo "Workflow checkout/merge SHA: $WORKFLOW_SHA"

      - name: Run M6 React Native pipeline test
        run: |
          pnpm exec tsx --test tests/apk-identity-gate.test.ts
          RUN_ANDROID_INTEGRATION=1 pnpm exec tsx --test tests/react-native-pipeline.test.ts tests/react-native-bare-scaffold.test.ts

      - name: Find APK
        run: |
          find . -name "*.apk" -type f


      - name: Generate APK checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path(".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          import subprocess
          badging = subprocess.check_output([os.path.join(os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", "")), "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          application_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not application_id:
              raise SystemExit("Could not read application ID from APK manifest")
          java_version_result = subprocess.run(["java", "-version"], capture_output=True, text=True, check=True)
          java_version_output = (java_version_result.stderr or java_version_result.stdout).strip()
          java_properties_result = subprocess.run(["java", "-XshowSettings:properties", "-version"], capture_output=True, text=True, check=True)
          java_properties_output = java_properties_result.stderr + "\n" + java_properties_result.stdout
          java_properties = {}
          for line in java_properties_output.splitlines():
              key, separator, value = line.partition("=")
              key = key.strip()
              if separator and key.startswith("java."):
                  java_properties[key] = value.strip()
          java_identity = {
              "configured_distribution": "temurin",
              "vendor": java_properties.get("java.vendor", "UNKNOWN"),
              "version": java_properties.get("java.version", "UNKNOWN"),
              "runtime_version": java_properties.get("java.runtime.version", "UNKNOWN"),
              "java_version_output": java_version_output,
          }
          print(json.dumps({"jdk": java_identity, "run_id": os.environ["GITHUB_RUN_ID"]}, indent=2))
          provenance = {
              "jdk": java_identity,
              "application_id": application_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {
                  "path": str(apk),
                  "size_bytes": apk.stat().st_size,
                  "sha256": digest,
              },
              "ci_build": True,
              "real_device_acceptance": "NOT_RUN",
          }
          apk.with_name("provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(provenance, indent=2))
          PY

      - name: Enforce APK identity and provenance gate
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          PROVENANCE_PATH="$(dirname "$APK_PATH")/provenance.json"
          GATE_ARGS=()

          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin
          else
            git fetch --no-tags origin
          fi

          PUSH_BEFORE_SHA_VALUE="${PUSH_BEFORE_SHA:-}"
          MAIN_SHA=""
          if [[ -n "${PR_NUMBER:-}" ]]; then
            test -n "${PR_BASE_REF:-}"
            test -n "${PR_BASE_SHA:-}"
            test -n "${PR_HEAD_SHA:-}"
            BASE_REF="refs/remotes/origin/$PR_BASE_REF"
            HEAD_REF="refs/remotes/pull/$PR_NUMBER/head"
            git fetch --no-tags origin \
              "+refs/heads/$PR_BASE_REF:$BASE_REF" \
              "+refs/pull/$PR_NUMBER/head:$HEAD_REF"
            test "$(git rev-parse "$BASE_REF")" = "$PR_BASE_SHA"
            test "$(git rev-parse "$HEAD_REF")" = "$PR_HEAD_SHA"
            test "$SOURCE_COMMIT" = "$PR_HEAD_SHA"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            # github.event.before is the trusted main revision before this push.
            # Do not use SOURCE_COMMIT^: a multi-commit push could make that parent
            # part of the same untrusted candidate update.
            [[ "$PUSH_BEFORE_SHA_VALUE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PUSH_BEFORE_SHA_VALUE" != "0000000000000000000000000000000000000000" ]]
            git fetch --no-tags origin "$PUSH_BEFORE_SHA_VALUE"
            git cat-file -e "$PUSH_BEFORE_SHA_VALUE^{commit}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            # A manual dispatch on protected main trusts the exact dispatched
            # source revision, including any registry update already on that ref.
            MAIN_SHA="$SOURCE_COMMIT"
          else
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi

          export PUSH_BEFORE_SHA_VALUE MAIN_SHA SOURCE_COMMIT
          TRUSTED_REGISTRY_COMMIT="$(node --input-type=module -e '
            import { resolveTrustedRegistryRevision } from "./scripts/m6-trusted-registry-revision.mjs";
            const trusted = resolveTrustedRegistryRevision({
              eventName: process.env.GITHUB_EVENT_NAME,
              ref: process.env.GITHUB_REF,
              prBaseSha: process.env.PR_BASE_SHA || "",
              pushBeforeSha: process.env.PUSH_BEFORE_SHA_VALUE || "",
              sourceSha: process.env.SOURCE_COMMIT || "",
              mainSha: process.env.MAIN_SHA || ""
            });
            process.stdout.write(trusted);
          ')"
          echo "Trusted registry revision: $TRUSTED_REGISTRY_COMMIT (event=$GITHUB_EVENT_NAME ref=$GITHUB_REF)"

          [[ "$TRUSTED_REGISTRY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$TRUSTED_REGISTRY_COMMIT^{commit}"
          git show "$TRUSTED_REGISTRY_COMMIT:docs/tested-apk-registry.json" > "$RUNNER_TEMP/trusted-tested-apk-registry.json"

          BASELINE_SOURCE_COMMIT="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { selectLatestM6Baseline } from "./scripts/m6-behavior-diff-gate.mjs";
            const registry = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(selectLatestM6Baseline(registry).source_commit);
          ' "$RUNNER_TEMP/trusted-tested-apk-registry.json")"
          [[ "$BASELINE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASELINE_SOURCE_COMMIT^{commit}"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          MERGE_BASE="$(git merge-base "$BASELINE_SOURCE_COMMIT" "$SOURCE_COMMIT")"
          test "$MERGE_BASE" = "$BASELINE_SOURCE_COMMIT"

          set +e
          git diff --quiet "$BASELINE_SOURCE_COMMIT" "$SOURCE_COMMIT" -- tests/fixtures/react-native-project/App.js
          APP_DIFF_STATUS=$?
          git diff --quiet "$BASELINE_SOURCE_COMMIT" "$SOURCE_COMMIT" -- tests/react-native-pipeline.test.ts
          TEST_DIFF_STATUS=$?
          set -e

          git diff "$BASELINE_SOURCE_COMMIT" "$SOURCE_COMMIT" -- tests/fixtures/react-native-project/App.js > "$RUNNER_TEMP/m6-app.diff"
          git diff "$BASELINE_SOURCE_COMMIT" "$SOURCE_COMMIT" -- tests/react-native-pipeline.test.ts > "$RUNNER_TEMP/m6-test.diff"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { classifyBehaviorDiff } from "./scripts/m6-behavior-diff-gate.mjs";
            const result = classifyBehaviorDiff({
              mergeBase: process.argv[1],
              baselineCommit: process.argv[2],
              appDiffExitCode: Number(process.argv[3]),
              testDiffExitCode: Number(process.argv[4]),
              appDiff: readFileSync(process.argv[5], "utf8"),
              testDiff: readFileSync(process.argv[6], "utf8")
            });
            writeFileSync(process.argv[7], JSON.stringify(result));
            console.log(JSON.stringify(result));
          ' "$MERGE_BASE" "$BASELINE_SOURCE_COMMIT" "$APP_DIFF_STATUS" "$TEST_DIFF_STATUS" \
            "$RUNNER_TEMP/m6-app.diff" "$RUNNER_TEMP/m6-test.diff" "$RUNNER_TEMP/m6-behavior-decision.json"

          if [[ "$(node -e 'const d=require(process.argv[1]); process.stdout.write(String(d.behaviorChanged))' "$RUNNER_TEMP/m6-behavior-decision.json")" == "true" ]]; then
            TARGET_BEHAVIOR="$(node -e 'const d=require(process.argv[1]); process.stdout.write(d.targetBehavior)' "$RUNNER_TEMP/m6-behavior-decision.json")"
            test -n "$TARGET_BEHAVIOR"
            GATE_ARGS+=(--target-behavior "$TARGET_BEHAVIOR")
            GATE_ARGS+=(--behavior-change-verified true)
          else
            echo "No verified paired M6 behavior and regression-test change from the physical-device registry baseline; eligibility remains blocked."
          fi

          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$PROVENANCE_PATH" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-application-id "com.builder.m6reactnative" \
            "${GATE_ARGS[@]}" \
            --registry "$RUNNER_TEMP/trusted-tested-apk-registry.json" \
            --output apk-identity-gate-report.json

      - name: Generate and validate bare-scaffold APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk = Path(".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk")
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          badging = subprocess.check_output([os.path.join(sdk, "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          app_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not app_id:
              raise SystemExit("Could not read application ID from bare-scaffold APK")
          java_version_result = subprocess.run(["java", "-version"], capture_output=True, text=True, check=True)
          java_version_output = (java_version_result.stderr or java_version_result.stdout).strip()
          java_properties_result = subprocess.run(["java", "-XshowSettings:properties", "-version"], capture_output=True, text=True, check=True)
          java_properties_output = java_properties_result.stderr + "\n" + java_properties_result.stdout
          java_properties = {}
          for line in java_properties_output.splitlines():
              key, separator, value = line.partition("=")
              key = key.strip()
              if separator and key.startswith("java."):
                  java_properties[key] = value.strip()
          java_identity = {
              "configured_distribution": "temurin",
              "vendor": java_properties.get("java.vendor", "UNKNOWN"),
              "version": java_properties.get("java.version", "UNKNOWN"),
              "runtime_version": java_properties.get("java.runtime.version", "UNKNOWN"),
              "java_version_output": java_version_output,
          }
          print(json.dumps({"jdk": java_identity, "run_id": os.environ["GITHUB_RUN_ID"]}, indent=2))
          provenance = {
              "jdk": java_identity,
              "application_id": app_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {"path": str(apk), "size_bytes": apk.stat().st_size, "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()},
              "ci_build": True,
              "real_device_acceptance": "NOT_RUN",
              "fixture": "bare-react-native-custom-main-entrypoint"
          }
          apk.with_name("provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(provenance, indent=2))
          PY
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$OUT_DIR/provenance.json" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --registry "$RUNNER_TEMP/trusted-tested-apk-registry.json" \
            --output bare-scaffold-apk-identity-gate-report.json

      - name: Upload APK checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m6-build-apk
          path: |
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/provenance.json
            apk-identity-gate-report.json
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/provenance.json
            bare-scaffold-apk-identity-gate-report.json
          if-no-files-found: error
          retention-days: 14
