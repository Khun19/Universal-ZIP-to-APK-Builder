name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-reacthost-init
  workflow_dispatch:

jobs:
  m6-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run M6 React Native pipeline test
        run: |
          RUN_ANDROID_INTEGRATION=1 \
          pnpm exec tsx --test tests/react-native-pipeline.test.ts
