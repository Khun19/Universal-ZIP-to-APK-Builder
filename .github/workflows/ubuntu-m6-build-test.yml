name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-reacthost-init
  workflow_dispatch:

jobs:
  m6-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android env vars
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Add Android build-tools to PATH
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH; fi

      - name: Ensure Gradle wrapper & show versions
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; echo "Using project Gradle wrapper:"; ./gradlew --version || true; fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; echo "Using android/gradlew:"; android/gradlew --version || true; fi
          gradle --version || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run M6 React Native pipeline test
        run: |
          RUN_ANDROID_INTEGRATION=1 \
          pnpm exec tsx --test tests/react-native-pipeline.test.ts

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: m6-build-apk
          path: "**/*.apk"
          if-no-files-found: ignore

      - name: SHA256 APK
        run: |
          find . -name "*.apk" -type f -exec sha256sum {} \;
