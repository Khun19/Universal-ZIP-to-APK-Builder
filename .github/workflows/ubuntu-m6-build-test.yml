name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-theme
      - fix/m6-runtime-interaction
      - feat/main-m2-m6-framework-integration
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Export Android env vars
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "emulator" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64" "ndk;25.2.9519653" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify React Native native toolchains
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/ndk/25.2.9519653/build/cmake/android.toolchain.cmake"
          test -f "$SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/ninja"
          test -x "$SDK_ROOT/emulator/emulator"
          test -d "$SDK_ROOT/system-images/android-34/google_apis/x86_64"
          echo "Verified NDK 25.2.9519653, NDK 26.1.10909125, CMake 3.22.1, Ninja, and Android 34 x86_64 emulator image."

      - name: Add Android build-tools to PATH
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH; fi

      - name: Show resolved toolchain
        run: |
          java -version
          node --version
          pnpm --version
          sdkmanager --list_installed
          find . -path '*/gradle/wrapper/gradle-wrapper.properties' -print

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Resolve source and workflow commit identities
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
          test -n "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"
          echo "Source commit: $SOURCE_COMMIT"
          echo "Workflow checkout/merge SHA: $WORKFLOW_SHA"

      - name: Run M6 React Native pipeline test
        run: |
          pnpm exec tsx --test tests/apk-identity-gate.test.ts
          RUN_ANDROID_INTEGRATION=1 pnpm exec tsx --test tests/react-native-pipeline.test.ts tests/react-native-bare-scaffold.test.ts

      - name: Boot Android 14 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK_ROOT=$SDK_ROOT"
          "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            --name builder-api34-x86_64 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device pixel_2 --force
          nohup "$SDK_ROOT/emulator/emulator" \
            -avd builder-api34-x86_64 \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel off -wipe-data \
            > emulator-evidence/emulator.log 2>&1 &
          echo $! > emulator-evidence/emulator.pid
          adb wait-for-device
          booted=0
          for attempt in $(seq 1 180); do
            state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android emulator did not finish booting within 6 minutes." >&2
            adb devices -l || true
            tail -n 200 emulator-evidence/emulator.log || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.release | tee emulator-evidence/android-release.txt
          adb shell getprop ro.build.version.sdk | tee emulator-evidence/android-api.txt
          adb shell getprop ro.product.cpu.abi | tee emulator-evidence/android-abi.txt
          adb devices -l | tee emulator-evidence/adb-devices.txt

      - name: Install and launch M6 APK in emulator
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK_ROOT/build-tools/34.0.0/aapt"
          PACKAGE_ID="$("$AAPT" dump badging "$APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE_ID" = "com.builder.m6reactnative"
          sha256sum "$APK_PATH" | tee emulator-evidence/apk-sha256.txt
          stat -c 'APK_SIZE_BYTES=%s' "$APK_PATH" | tee emulator-evidence/apk-size.txt
          adb install -r "$APK_PATH" 2>&1 | tee emulator-evidence/install.log
          adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1 2>&1 | tee emulator-evidence/launch.log
          app_alive=0
          for attempt in $(seq 1 30); do
            if adb shell pidof "$PACKAGE_ID" | tr -d '\r' | grep -q '[0-9]'; then app_alive=1; break; fi
            sleep 2
          done
          if [ "$app_alive" -ne 1 ]; then
            adb logcat -d > emulator-evidence/logcat-full.txt || true
            echo "APK process did not remain alive after launch." >&2
            exit 1
          fi
          sleep 8
          adb shell pidof "$PACKAGE_ID" | tee emulator-evidence/app-pid.txt
          adb exec-out screencap -p > emulator-evidence/launch-screenshot.png
          adb logcat -d > emulator-evidence/logcat-full.txt
          if grep -E -i "FATAL EXCEPTION|Fatal signal [0-9]+|Process: ${PACKAGE_ID}.*has died" emulator-evidence/logcat-full.txt; then
            echo "Crash signature found in emulator logcat." >&2
            exit 1
          fi
          echo "EMULATOR_INSTALL=PASS"
          echo "EMULATOR_LAUNCH=PASS"
          echo "EMULATOR_PROCESS_STABILITY=PASS"

      - name: Upload emulator device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-android-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Generate APK checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk = Path(".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          badging = subprocess.check_output([os.path.join(sdk, "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          application_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not application_id:
              raise SystemExit("Could not read application ID from APK manifest")
          provenance = {
              "application_id": application_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {
                  "path": str(apk),
                  "size_bytes": apk.stat().st_size,
                  "sha256": digest,
              },
              "ci_build": True,
              "emulator_install_launch": "PASS",
              "real_device_acceptance": "NOT_RUN",
          }
          apk.with_name("provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(provenance, indent=2))
          PY

      - name: Enforce APK identity and provenance gate
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          PROVENANCE_PATH="$(dirname "$APK_PATH")/provenance.json"
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$PROVENANCE_PATH" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-application-id "com.builder.m6reactnative" \
            --registry docs/tested-apk-registry.json \
            --output apk-identity-gate-report.json

      - name: Generate and validate bare-scaffold APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk = Path(".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk")
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          badging = subprocess.check_output([os.path.join(sdk, "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          app_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not app_id:
              raise SystemExit("Could not read application ID from bare-scaffold APK")
          provenance = {
              "application_id": app_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {"path": str(apk), "size_bytes": apk.stat().st_size, "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()},
              "ci_build": True,
              "real_device_acceptance": "NOT_RUN",
              "fixture": "bare-react-native-custom-main-entrypoint"
          }
          apk.with_name("provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(provenance, indent=2))
          PY
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$OUT_DIR/provenance.json" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --registry docs/tested-apk-registry.json \
            --output bare-scaffold-apk-identity-gate-report.json

      - name: Upload APK checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m6-build-apk
          path: |
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/provenance.json
            apk-identity-gate-report.json
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/provenance.json
            bare-scaffold-apk-identity-gate-report.json
          if-no-files-found: error
          retention-days: 14
