name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-theme
      - fix/m6-runtime-interaction
      - feat/main-m2-m6-framework-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Export Android env vars
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Add Android build-tools to PATH
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH; fi

      - name: Show resolved toolchain
        run: |
          java -version
          node --version
          pnpm --version
          sdkmanager --list_installed
          find . -path '*/gradle/wrapper/gradle-wrapper.properties' -print

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Run M6 React Native pipeline test
        run: |
          RUN_ANDROID_INTEGRATION=1 pnpm exec tsx --test tests/react-native-pipeline.test.ts

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Write M6 APK provenance
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .ci-evidence
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path

          apk = Path(".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk")
          apk_hash = None
          apk_size = None
          if apk.is_file():
              h = hashlib.sha256()
              with apk.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              apk_hash = h.hexdigest()
              apk_size = apk.stat().st_size

          def command(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc:
                  return f"unavailable: {exc}"

          event_payload = {}
          event_path = os.getenv("GITHUB_EVENT_PATH")
          if event_path and Path(event_path).is_file():
              try:
                  event_payload = json.loads(Path(event_path).read_text(encoding="utf-8"))
              except Exception:
                  event_payload = {}
          pull_request = event_payload.get("pull_request") or {}

          record = {
              "schemaVersion": 2,
              "evidenceType": "android-apk-build",
              "milestone": "M6",
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "commit": os.getenv("GITHUB_SHA"),
              "ref": os.getenv("GITHUB_REF"),
              "runId": os.getenv("GITHUB_RUN_ID"),
              "runAttempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "source": {
                  "gitHead": command("git", "rev-parse", "HEAD"),
                  "checkoutSha": os.getenv("GITHUB_SHA"),
                  "pullRequestHeadSha": (pull_request.get("head") or {}).get("sha"),
                  "pullRequestBaseSha": (pull_request.get("base") or {}).get("sha"),
              },
              "runner": {"os": platform.platform()},
              "toolchain": {
                  "java": command("java", "-version"),
                  "node": command("node", "--version"),
                  "pnpm": command("pnpm", "--version"),
                  "sdkmanager": command("sdkmanager", "--version"),
              },
              "inputs": {
                  "pnpmLockSha256": hashlib.sha256(Path("pnpm-lock.yaml").read_bytes()).hexdigest()
                      if Path("pnpm-lock.yaml").is_file() else None,
              },
              "artifact": {
                  "path": str(apk),
                  "found": apk.is_file(),
                  "sizeBytes": apk_size,
                  "sha256": apk_hash,
              },
              "runtimeValidation": "not-performed-by-ubuntu-build-workflow",
          }
          Path(".ci-evidence/m6-apk-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          if apk_hash:
              Path(".ci-evidence/app-debug.apk.sha256").write_text(
                  f"{apk_hash}  app-debug.apk\n", encoding="utf-8"
              )
          PY

      - name: Upload M6 provenance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/m6-apk-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload M6 APK and checksum
        if: success() && hashFiles('.workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: m6-build-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk
            .ci-evidence/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Validate APK output exists
        run: test -s .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk
