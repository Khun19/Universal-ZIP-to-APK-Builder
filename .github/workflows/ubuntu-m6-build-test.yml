name: Ubuntu M6 Build Test

on:
  push:
    branches:
      - fix/m6-g10-theme
      - fix/m6-runtime-interaction
      - feat/main-m2-m6-framework-integration
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Export Android env vars
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify React Native native toolchains
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/ndk/25.2.9519653/build/cmake/android.toolchain.cmake"
          test -f "$SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/ninja"
          echo "Verified NDK 25.2.9519653, NDK 26.1.10909125, CMake 3.22.1 and Ninja."

      - name: Add Android build-tools to PATH
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH; fi

      - name: Show resolved toolchain
        run: |
          java -version
          node --version
          pnpm --version
          sdkmanager --list_installed
          find . -path '*/gradle/wrapper/gradle-wrapper.properties' -print

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Resolve source and workflow commit identities
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
          test -n "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"
          echo "Source commit: $SOURCE_COMMIT"
          echo "Workflow checkout/merge SHA: $WORKFLOW_SHA"

      - name: Run M6 React Native pipeline test
        run: |
          pnpm exec tsx --test tests/apk-identity-gate.test.ts
          RUN_ANDROID_INTEGRATION=1 pnpm exec tsx --test tests/react-native-pipeline.test.ts tests/react-native-bare-scaffold.test.ts

      - name: Find APK
        run: |
          find . -name "*.apk" -type f


      - name: Validate exact M6 APK output and structure
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          MAX_SIZE_BYTES=$((250 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "::error::APK exceeds 250 MiB policy limit: $SIZE_BYTES bytes"
            exit 1
          fi
          python - "$APK_PATH" "$SIZE_BYTES" <<'PY'
          import sys, zipfile
          path, size = sys.argv[1], int(sys.argv[2])
          with zipfile.ZipFile(path) as apk:
              bad = apk.testzip()
              if bad:
                  raise SystemExit(f"APK ZIP CRC/read validation failed at: {bad}")
              names = set(apk.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK missing AndroidManifest.xml")
              has_dex = any(n.startswith("classes") and n.endswith(".dex") for n in names)
              has_native = any(n.startswith("lib/") and n.endswith(".so") for n in names)
              if not (has_dex or has_native):
                  raise SystemExit("APK missing DEX files and native libraries")
              print(f"APK structure PASS; size_bytes={size}; dex={has_dex}; native_libs={has_native}")
          PY
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK_ANALYZER="$(find "$SDK_ROOT" -path '*/bin/apkanalyzer' -type f -print -quit)"
          if [ -n "$APK_ANALYZER" ]; then
            APP_ID="$("$APK_ANALYZER" manifest application-id "$APK_PATH")"
          else
            AAPT="$SDK_ROOT/build-tools/34.0.0/aapt"
            APP_ID="$("$AAPT" dump badging "$APK_PATH" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          fi
          test "$APP_ID" = "com.builder.m6reactnative" || {
            echo "::error::Unexpected APK application ID: $APP_ID"
            exit 1
          }
          echo "Validated exact APK: $APK_PATH"
          echo "Size bytes: $SIZE_BYTES"
          echo "Application ID: $APP_ID"

      - name: Generate APK checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path(".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          import subprocess
          badging = subprocess.check_output([os.path.join(os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", "")), "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          application_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not application_id:
              raise SystemExit("Could not read application ID from APK manifest")
          provenance = {
              "application_id": application_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "framework": "React Native",
              "build_strategy": "react-native-gradle-debug",
              "toolchain": {
                  "java_version": subprocess.check_output(["java", "-version"], stderr=subprocess.STDOUT, text=True).splitlines()[0],
                  "gradle_wrapper_version": next((line.split("=", 1)[1].strip() for line in Path(".workspace/m6-react-native-direct-integration/android/gradle/wrapper/gradle-wrapper.properties").read_text().splitlines() if line.startswith("distributionUrl=")), None),
                  "android_sdk_platform": "android-34",
                  "android_build_tools": "34.0.0",
                  "framework_version": json.loads(Path(".workspace/m6-react-native-direct-integration/package.json").read_text()).get("dependencies", {}).get("react-native"),
              },
              "validation_results": {
                  "exact_output_path": "PASS",
                  "non_empty_and_size_limit": "PASS",
                  "zip_crc_and_manifest_dex_or_native": "PASS",
                  "application_id_match": "PASS",
                  "sha256_recorded": "PASS",
                  "provenance_identity_gate": "PENDING_GATE_STEP",
              },
              "artifact": {
                  "path": str(apk),
                  "size_bytes": apk.stat().st_size,
                  "sha256": digest,
              },
              "ci_build": True,
              "device_acceptance": {"status": "NOT_RUN", "evidence": None},
              "real_device_acceptance": "NOT_RUN",
          }
          apk.with_name("provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(provenance, indent=2))
          PY

      - name: Enforce APK identity and provenance gate
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk"
          PROVENANCE_PATH="$(dirname "$APK_PATH")/provenance.json"
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$PROVENANCE_PATH" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-application-id "com.builder.m6reactnative" \
            --registry docs/tested-apk-registry.json \
            --output apk-identity-gate-report.json

      - name: Generate and validate bare-scaffold APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          MAX_SIZE_BYTES=$((250 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "::error::Bare-scaffold APK exceeds 250 MiB policy limit: $SIZE_BYTES bytes"
            exit 1
          fi
          python - "$APK_PATH" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              bad = apk.testzip()
              if bad:
                  raise SystemExit(f"Bare-scaffold APK ZIP CRC/read validation failed at: {bad}")
              names = set(apk.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("Bare-scaffold APK missing AndroidManifest.xml")
              if not (any(n.startswith("classes") and n.endswith(".dex") for n in names) or any(n.startswith("lib/") and n.endswith(".so") for n in names)):
                  raise SystemExit("Bare-scaffold APK missing DEX files and native libraries")
          PY
          OUT_DIR="$(dirname "$APK_PATH")"
          sha256sum "$APK_PATH" > "$OUT_DIR/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk = Path(".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk")
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          badging = subprocess.check_output([os.path.join(sdk, "build-tools", "34.0.0", "aapt"), "dump", "badging", str(apk)], text=True)
          app_id = next((line.split("name=\x27", 1)[1].split("\x27", 1)[0] for line in badging.splitlines() if line.startswith("package: name=\x27")), None)
          if not app_id:
              raise SystemExit("Could not read application ID from bare-scaffold APK")
          provenance = {
              "application_id": app_id,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "framework": "React Native",
              "build_strategy": "react-native-bare-scaffold-gradle-debug",
              "toolchain": {
                  "java_version": subprocess.check_output(["java", "-version"], stderr=subprocess.STDOUT, text=True).splitlines()[0],
                  "gradle_wrapper_version": next((line.split("=", 1)[1].strip() for line in Path(".workspace/m6-bare-react-native-scaffold-test/android/gradle/wrapper/gradle-wrapper.properties").read_text().splitlines() if line.startswith("distributionUrl=")), None),
                  "android_sdk_platform": "android-34",
                  "android_build_tools": "34.0.0",
                  "framework_version": None
              },
              "validation_results": {
                  "exact_output_path": "PASS",
                  "non_empty_and_size_limit": "PASS",
                  "zip_crc_and_manifest_dex_or_native": "PASS",
                  "application_id_extracted": "PASS",
                  "sha256_recorded": "PASS",
                  "provenance_identity_gate": "PENDING_GATE_STEP"
              },
              "artifact": {"path": str(apk), "size_bytes": apk.stat().st_size, "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()},
              "ci_build": True,
              "device_acceptance": {"status": "NOT_RUN", "evidence": None},
              "real_device_acceptance": "NOT_RUN",
              "fixture": "bare-react-native-custom-main-entrypoint"
          }
          apk.with_name("provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(provenance, indent=2))
          PY
          node scripts/apk-identity-gate.mjs \
            --apk "$APK_PATH" \
            --provenance "$OUT_DIR/provenance.json" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --registry docs/tested-apk-registry.json \
            --output bare-scaffold-apk-identity-gate-report.json

      - name: Finalize and re-check provenance gate results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          targets = [
              (
                  Path(".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/provenance.json"),
                  Path("apk-identity-gate-report.json"),
              ),
              (
                  Path(".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/provenance.json"),
                  Path("bare-scaffold-apk-identity-gate-report.json"),
              ),
          ]
          for provenance_path, report_path in targets:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if report.get("valid") is not True or report.get("errors") != []:
                  raise SystemExit(f"Identity gate did not pass: {report_path}")
              provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
              results = provenance.setdefault("validation_results", {})
              if results.get("provenance_identity_gate") != "PENDING_GATE_STEP":
                  raise SystemExit(f"Unexpected identity-gate state in {provenance_path}")
              results["provenance_identity_gate"] = "PASS"
              results["identity_gate_report_valid"] = "PASS"
              provenance_path.write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
              print(f"Finalized provenance gate result: {provenance_path}")
          PY
          node scripts/apk-identity-gate.mjs \
            --apk ".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk" \
            --provenance ".workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/provenance.json" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-application-id "com.builder.m6reactnative" \
            --registry docs/tested-apk-registry.json \
            --output apk-identity-gate-report.json
          node scripts/apk-identity-gate.mjs \
            --apk ".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk" \
            --provenance ".workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/provenance.json" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --registry docs/tested-apk-registry.json \
            --output bare-scaffold-apk-identity-gate-report.json

      - name: Upload APK checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m6-build-apk
          path: |
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-react-native-direct-integration/android/app/build/outputs/apk/debug/provenance.json
            apk-identity-gate-report.json
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/app-debug.apk
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            .workspace/m6-bare-react-native-scaffold-test/android/app/build/outputs/apk/debug/provenance.json
            bare-scaffold-apk-identity-gate-report.json
          if-no-files-found: error
          retention-days: 14
