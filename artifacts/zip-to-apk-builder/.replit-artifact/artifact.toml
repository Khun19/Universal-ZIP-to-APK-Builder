kind = "web"
previewPath = "/"
title = "Universal ZIP-to-APK Builder"
description = "A production-oriented build workspace for securely analyzing uploaded projects and producing validated Android APKs when the project is supported."
version = "1.0.0"
id = "artifacts/zip-to-apk-builder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20953

[services.development]
run = "pnpm --filter @workspace/zip-to-apk-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zip-to-apk-builder", "run", "build" ]
serve = "static"
publicDir = "artifacts/zip-to-apk-builder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20953"
BASE_PATH = "/"
