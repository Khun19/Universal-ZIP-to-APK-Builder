services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zip_to_apk
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
    ports: ["5432:5432"]
    volumes: [zip_to_apk_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    image: node:20-bookworm
    working_dir: /workspace
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run dev"]
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://builder:builder@postgres:5432/zip_to_apk
      REDIS_URL: redis://redis:6379
      BUILDER_STORAGE_DIR: /var/lib/zip-to-apk
    volumes:
      - .:/workspace
      - zip_to_apk_storage:/var/lib/zip-to-apk
    ports: ["5000:5000"]
    depends_on: [postgres, redis]
  worker:
    image: node:20-bookworm
    working_dir: /workspace
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm --filter @workspace/worker run dev"]
    environment:
      DATABASE_URL: postgresql://builder:builder@postgres:5432/zip_to_apk
      REDIS_URL: redis://redis:6379
      BUILDER_STORAGE_DIR: /var/lib/zip-to-apk
      ANDROID_BUILDER_IMAGE: universal-zip-to-apk/android-builder:latest
      BUILD_NETWORK: bridge
    volumes:
      - .:/workspace
      - zip_to_apk_storage:/var/lib/zip-to-apk
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [postgres, redis]
volumes:
  zip_to_apk_pg:
  zip_to_apk_storage: