<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{APP_NAME}} - Survey</title>
</head>
<body>
  <h1>{{APP_NAME}} - Offline Survey</h1>
  <form id="survey">
    <label>Name: <input name="name" /></label><br/>
    <label>Notes: <textarea name="notes"></textarea></label><br/>
    <button>Save</button>
  </form>
  <script>
    const form = document.getElementById('survey');
    form.addEventListener('submit', (e)=>{e.preventDefault();const fd=new FormData(form);const rec={name:fd.get('name'),notes:fd.get('notes'),ts:Date.now()};localStorage.setItem('lastSurvey',JSON.stringify(rec));alert('Saved offline');});
  </script>
</body>
</html>
