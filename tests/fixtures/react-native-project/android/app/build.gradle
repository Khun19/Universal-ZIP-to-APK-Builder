plugins {
    id 'com.android.application'
    id 'com.facebook.react'
}

react {
    autolinkLibrariesWithApp()
    debuggableVariants = []

    // RN 0.76 ships a Linux x86_64 hermesc but no Linux ARM64 host compiler.
    // On Termux ARM64, run that version-matched compiler through qemu-user.
    def termuxHermesCompiler = rootProject.file('../hermesc-termux.sh')
    def termuxQemu = new File(System.getenv('PREFIX') ?: '', 'bin/qemu-x86_64')
    if (System.getProperty('os.arch') == 'aarch64' && termuxHermesCompiler.isFile() && termuxQemu.isFile()) {
        termuxHermesCompiler.setExecutable(true)
        hermesCommand = termuxHermesCompiler.absolutePath
    }
}

android {
    namespace 'com.builder.m6reactnative'
    compileSdk 35

    defaultConfig {
        applicationId 'com.builder.m6reactnative'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

configurations.configureEach {
    exclude group: 'org.webkit', module: 'android-jsc'
}

dependencies {
    implementation('com.facebook.react:react-android')
    if (hermesEnabled.toBoolean()) {
        implementation('com.facebook.react:hermes-android:0.76.9')
    }
}
